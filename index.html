<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PlayJob — 重新定义求职体验</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000000;
      --surface: rgba(28, 28, 30, 0.7);
      --surface-solid: #1c1c1e;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #2997ff;
      --text: #f5f5f7;
      --muted: #86868b;
      --danger: #ff453a;
      --radius: 20px;
      --apple-bezier: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
    }

    /* ── Header (桌面端导航) ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 5%; position: sticky; top: 0; z-index: 1000;
      background: rgba(0, 0, 0, 0.75); backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.5rem; cursor: pointer; }
    .logo span { color: var(--accent); }
    
    .desktop-nav { display: flex; gap: 30px; }
    .desktop-nav a { color: var(--muted); text-decoration: none; font-size: 0.95rem; font-weight: 600; transition: 0.3s; padding: 8px 0; position: relative; }
    .desktop-nav a.active { color: var(--text); }
    .desktop-nav a.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: var(--accent); border-radius: 2px; }

    /* ── Mobile Tab Bar (手机端底部导航) ── */
    .mobile-tab-bar {
      display: none; position: fixed; bottom: 0; left: 0; width: 100%;
      height: 65px; background: rgba(18, 18, 18, 0.85); backdrop-filter: blur(20px);
      border-top: 1px solid var(--border); z-index: 1000;
      justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom);
    }
    .tab-item { display: flex; flex-direction: column; align-items: center; color: var(--muted); text-decoration: none; font-size: 0.7rem; gap: 4px; }
    .tab-item.active { color: var(--accent); }
    .tab-icon { font-size: 1.4rem; }

    /* ── Main Layout ── */
    main { width: 100%; max-width: 1400px; margin: 0 auto; padding: 30px 5% 100px; }
    .section { display: none; width: 100%; }
    .section.active { display: block; animation: fadeIn 0.4s var(--apple-bezier); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ── Search Bar ── */
    .search-wrapper { 
      display: flex; gap: 12px; margin-bottom: 30px; width: 100%;
      background: var(--surface-solid); padding: 8px; border-radius: 18px; border: 1px solid var(--border);
    }
    .search-wrapper input { flex: 1; padding: 12px 15px; background: transparent; border: none; color: #fff; font-size: 1rem; outline: none; }
    .btn-search { padding: 0 25px; background: var(--text); color: #000; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; }

    /* ── Job Grid ── */
    .job-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; width: 100%; }
    .job-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 24px; transition: 0.3s; position: relative;
    }
    .job-card:hover { border-color: var(--accent); background: rgba(45, 45, 48, 0.9); }
    .job-card .company { color: var(--accent); font-weight: 800; font-size: 0.8rem; margin-bottom: 8px; }
    .job-card .title { font-size: 1.2rem; font-weight: 700; margin-bottom: 16px; line-height: 1.3; }

    /* ── Kanban Board ── */
    .board-container { display: flex; overflow-x: auto; gap: 16px; padding-bottom: 10px; width: 100%; }
    .board-column { background: var(--surface-solid); border-radius: 20px; padding: 16px; min-width: 280px; flex: 1; min-height: 500px; }
    .board-column h3 { font-size: 1rem; margin-bottom: 15px; display: flex; justify-content: space-between; }
    .app-card { background: rgba(255,255,255,0.04); border-radius: 15px; padding: 15px; margin-bottom: 12px; border: 1px solid var(--border); position: relative; }

    /* ── 🍎 真·双列瀑布流社区 ── */
    .waterfall-container {
      width: 100%; column-count: 4; column-gap: 16px; margin-top: 20px;
    }
    .post-card {
      break-inside: avoid; background: var(--surface-solid); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden; margin-bottom: 16px; transition: 0.3s;
    }
    .post-cover { width: 100%; height: 140px; background: linear-gradient(135deg, #2c2c2e, #1c1c1e); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; }
    .post-body { padding: 12px; }
    .post-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 6px; line-height: 1.4; color: var(--text); }
    .post-footer { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--muted); }
    .author { display: flex; align-items: center; gap: 6px; }
    .avatar { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); }

    /* ── FAB & Modals ── */
    .fab {
      position: fixed; bottom: 85px; right: 25px; width: 56px; height: 56px;
      background: var(--accent); color: #fff; border-radius: 50%; font-size: 24px;
      display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 999;
      box-shadow: 0 8px 24px rgba(41, 151, 255, 0.4);
    }

    /* ── 📱 移动端专项适配 ── */
    @media (max-width: 768px) {
      header { padding: 12px 5%; }
      .desktop-nav, .login-btn { display: none; } /* 隐藏顶部多余 */
      .mobile-tab-bar { display: flex; } /* 显示底部Tab */
      
      main { padding: 20px 4% 100px; }
      .search-wrapper { border-radius: 14px; }
      .job-grid { grid-template-columns: 1fr; }
      
      /* 手机端面经瀑布流改为2列 */
      .waterfall-container { column-count: 2; column-gap: 12px; }
      .post-cover { height: 110px; font-size: 2rem; }
      .board-column { min-width: 85vw; } /* 看板一屏一个 */
    }

    /* ── 🖥️ 宽屏适配 ── */
    @media (min-width: 1200px) {
      .waterfall-container { column-count: 5; } /* 宽屏5列，占满屏幕 */
    }

    #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 10px 24px; border-radius: 50px; font-weight: 700; z-index: 3000; display: none; }
  </style>
</head>
<body>

<header>
  <div class="logo" onclick="showSection('jobs')">Play<span>Job</span></div>
  <nav class="desktop-nav">
    <a href="#" class="active" id="dnav-jobs" onclick="showSection('jobs', this)">职位广场</a>
    <a href="#" id="dnav-board" onclick="showSection('board', this)">投递看板</a>
    <a href="#" id="dnav-forum" onclick="showSection('forum', this)">面经社区</a>
  </nav>
  <button class="btn-search" style="padding: 6px 15px; font-size: 0.8rem;" onclick="showToast('请使用底部功能切换')">我的账户</button>
</header>

<div class="mobile-tab-bar">
  <a href="#" class="tab-item active" id="tab-jobs" onclick="showSection('jobs', this)">
    <span class="tab-icon">🔍</span>
    <span>发现</span>
  </a>
  <a href="#" class="tab-item" id="tab-board" onclick="showSection('board', this)">
    <span class="tab-icon">📋</span>
    <span>看板</span>
  </a>
  <a href="#" class="tab-item" id="tab-forum" onclick="showSection('forum', this)">
    <span class="tab-icon">💬</span>
    <span>社区</span>
  </a>
</div>

<main>
  <section id="section-jobs" class="section active">
    <div class="search-wrapper">
      <input id="q-input" type="text" placeholder="搜索全球 1000+ 优质岗位..." />
      <button class="btn-search" onclick="searchJobs()">搜索</button>
    </div>
    <div class="job-grid" id="job-grid"></div>
  </section>

  <section id="section-board" class="section">
    <div class="board-container" id="board-container"></div>
  </section>

  <section id="section-forum" class="section">
    <div class="search-wrapper">
      <input id="f-search" type="text" placeholder="搜面经：腾讯、量化、大模型..." />
      <button class="btn-search" onclick="fetchPosts()">搜经验</button>
    </div>
    <div class="waterfall-container" id="posts-list"></div>
  </section>
</main>

<div class="fab" onclick="handleFab()">+</div>
<div id="toast"></div>

<script>
const API = 'https://intern-api-16ja.onrender.com/api';
let currentTab = 'jobs';

function showToast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

function showSection(name, el) {
  currentTab = name;
  // 清除所有 active
  document.querySelectorAll('.desktop-nav a, .tab-item, .section').forEach(i => i.classList.remove('active'));
  
  // 激活对应的导航和部分
  if (window.innerWidth > 768) {
    document.getElementById(`dnav-${name}`).classList.add('active');
  } else {
    document.getElementById(`tab-${name}`).classList.add('active');
  }
  document.getElementById(`section-${name}`).classList.add('active');

  if(name === 'board') fetchBoard();
  if(name === 'forum') fetchPosts();
}

async function searchJobs() {
  const q = document.getElementById('q-input').value;
  const grid = document.getElementById('job-grid');
  grid.innerHTML = '<div style="color:var(--muted)">扫描数据库中...</div>';
  try {
    const res = await fetch(`${API}/live-search?q=${encodeURIComponent(q)}`);
    const { data } = await res.json();
    grid.innerHTML = data.map(j => `
      <div class="job-card">
        <div class="company">${j.company}</div>
        <div class="title">${j.title}</div>
        <div style="font-size:0.8rem; color:var(--muted); margin-bottom:15px;">📍 ${j.location || '全国'}</div>
        <div style="display:flex; gap:10px;">
          <button class="btn-search" style="flex:1; background:var(--accent); color:#fff;" onclick="window.open('${j.sourceUrl}')">直达</button>
          <button class="btn-search" style="flex:1; background:rgba(255,255,255,0.1); color:#fff;" onclick="addBoard('${j.company}','${j.title}')">看板</button>
        </div>
      </div>
    `).join('');
  } catch(e) { grid.innerHTML = '加载失败'; }
}

async function addBoard(company, title) {
  await fetch(`${API}/applications`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({company, title}) });
  showToast('✅ 已加入看板');
}

async function fetchBoard() {
  const container = document.getElementById('board-container');
  const STATUS = { applied:'投递', interview:'面试', offer:'录取', reject:'淘汰' };
  try {
    const res = await fetch(`${API}/applications`);
    const { board } = await res.json();
    container.innerHTML = Object.keys(STATUS).map(s => `
      <div class="board-column">
        <h3>${STATUS[s]} <span>${board[s]?.length || 0}</span></h3>
        ${(board[s] || []).map(item => `
          <div class="app-card">
            <div style="font-weight:700; font-size:0.9rem;">${item.title}</div>
            <div style="font-size:0.8rem; color:var(--muted); margin-bottom:8px;">${item.company}</div>
            <div style="display:flex; gap:4px;">
               <button onclick="delApp('${item._id}')" style="background:none; border:none; color:var(--danger); font-size:0.7rem;">移除</button>
            </div>
          </div>
        `).join('')}
      </div>
    `).join('');
  } catch(e) {}
}

async function delApp(id) { await fetch(`${API}/applications/${id}`, {method:'DELETE'}); fetchBoard(); }

async function fetchPosts() {
  const list = document.getElementById('posts-list');
  const mock = [
    { t: "英伟达GPU架构组面经", c: "🚀", a: "AI芯片专家", l: 243 },
    { t: "字节跳动日常实习真题", c: "🍱", a: "干饭人", l: 89 },
    { t: "中金投行暑期PTA分享", c: "📈", a: "金融萌新", l: 156 },
    { t: "米哈游TA岗三面复盘", c: "🎨", a: "原神启动", l: 432 },
    { t: "从量化面试看数学基础", c: "🧮", a: "数学帝", l: 678 },
    { t: "小红书运营岗二面细节", c: "🧧", a: "运营小妹", l: 231 }
  ];
  list.innerHTML = mock.map(p => `
    <div class="post-card">
      <div class="post-cover">${p.c}</div>
      <div class="post-body">
        <div class="post-title">${p.t}</div>
        <div class="post-footer">
          <div class="author"><div class="avatar"></div> ${p.a}</div>
          <div>❤️ ${p.l}</div>
        </div>
      </div>
    </div>
  `).join('');
}

function handleFab() { showToast('发布功能正在接入...'); }

// 初始化
searchJobs();
</script>
</body>
</html>
