<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PlayJob — 探索你的无限可能</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000000;
      --surface: rgba(28, 28, 30, 0.6);
      --surface-solid: #1c1c1e;
      --border: rgba(255, 255, 255, 0.12);
      --accent: #2997ff;
      --text: #f5f5f7;
      --muted: #86868b;
      --danger: #ff453a;
      --radius: 20px;
      --apple-bezier: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden;
    }

    /* ── Header ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 5%; position: sticky; top: 0; z-index: 1000;
      background: rgba(0, 0, 0, 0.75); backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.6rem; cursor: pointer; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); }
    nav { display: flex; gap: 24px; align-items: center; }
    nav a { color: var(--muted); text-decoration: none; font-size: 0.95rem; font-weight: 600; transition: 0.3s; padding: 8px 4px; position: relative; }
    nav a:hover, nav a.active { color: var(--text); }
    nav a.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: var(--accent); border-radius: 2px; }
    .login-btn { padding: 6px 16px; background: rgba(255,255,255,0.1); border-radius: 99px; font-size: 0.85rem; color: #fff; cursor: pointer; transition: 0.3s; border: 1px solid var(--border); }
    .login-btn:hover { background: #fff; color: #000; }

    main { max-width: 1200px; margin: 0 auto; padding: 40px 5% 100px; }
    .section { display: none; }
    .section.active { display: block; animation: slideUp 0.6s var(--apple-bezier); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    /* ── Search Bar ── */
    .search-wrapper { 
      display: flex; gap: 15px; margin-bottom: 40px; 
      background: var(--surface-solid); padding: 12px; border-radius: 24px;
      border: 1px solid var(--border);
    }
    .search-wrapper input { 
      flex: 1; padding: 12px 20px; background: transparent; border: none; 
      color: #fff; font-size: 1.1rem; outline: none; 
    }
    .search-wrapper .btn-primary { padding: 0 35px; border-radius: 16px; font-size: 1rem; }

    /* ── Job Cards (优化手机端宽度) ── */
    #jobs-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .job-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 24px; transition: 0.4s var(--apple-bezier); display: flex; flex-direction: column;
    }
    .job-card:hover { transform: translateY(-5px); border-color: rgba(255,255,255,0.4); background: rgba(45, 45, 48, 0.9); }
    .job-card .company { color: var(--accent); font-weight: 800; font-size: 0.85rem; margin-bottom: 8px; text-transform: uppercase; }
    .job-card .title { font-size: 1.25rem; font-weight: 700; line-height: 1.3; margin-bottom: 16px; }
    .job-card .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    .tag { padding: 4px 10px; background: rgba(255,255,255,0.08); border-radius: 8px; font-size: 0.75rem; color: var(--muted); }

    /* ── Kanban Board ── */
    .board-container { display: flex; overflow-x: auto; gap: 20px; padding-bottom: 20px; -webkit-overflow-scrolling: touch; }
    .board-column { background: var(--surface-solid); border-radius: 24px; padding: 20px; min-width: 280px; flex: 1; min-height: 500px; }
    .board-column h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .board-column h3 span { background: rgba(255,255,255,0.1); padding: 2px 10px; border-radius: 12px; font-size: 0.8rem; color: var(--accent); }
    .app-card { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 15px; position: relative; }
    .btn-delete { position: absolute; top: 12px; right: 12px; background: none; border: none; color: var(--danger); font-size: 1.2rem; cursor: pointer; opacity: 0.5; transition: 0.3s; }

    /* ── Xiaohongshu-Style Forum (瀑布流) ── */
    .waterfall {
      column-count: 4; column-gap: 20px; margin-top: 20px;
    }
    .post-card {
      break-inside: avoid; background: var(--surface-solid); border: 1px solid var(--border);
      border-radius: 20px; overflow: hidden; margin-bottom: 20px; transition: 0.3s; cursor: pointer;
    }
    .post-card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.3); }
    .post-cover { width: 100%; height: 120px; background: linear-gradient(45deg, #1c1c1e, #2c2c2e); display: flex; align-items: center; justify-content: center; font-size: 2rem; }
    .post-content { padding: 16px; }
    .post-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 8px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .post-desc { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .post-footer { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--muted); }
    .author-info { display: flex; align-items: center; gap: 8px; }
    .avatar { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); }
    .post-actions span { display: inline-flex; align-items: center; gap: 4px; transition: 0.2s; }
    .post-actions span:hover { color: var(--accent); }

    /* ── Floating Action Button (FAB) ── */
    .fab {
      position: fixed; bottom: 40px; right: 40px; width: 60px; height: 60px;
      background: var(--text); color: #000; border-radius: 50%; font-size: 2rem;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer; box-shadow: 0 10px 30px rgba(255,255,255,0.2);
      transition: 0.4s var(--apple-bezier); z-index: 999;
    }
    .fab:hover { transform: scale(1.1) rotate(90deg); background: var(--accent); color: #fff; box-shadow: 0 15px 40px rgba(41, 151, 255, 0.4); }

    /* ── Modals ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
      display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.4s; z-index: 2000;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: #1c1c1e; border: 1px solid var(--border); border-radius: 30px;
      width: 90%; max-width: 450px; padding: 40px; transform: scale(0.9); transition: 0.4s var(--apple-bezier);
    }
    .modal-overlay.active .modal-box { transform: scale(1); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .modal-header h3 { font-size: 1.5rem; font-weight: 800; }
    .btn-close { background: none; border: none; color: var(--muted); font-size: 2rem; cursor: pointer; }
    .form-input { width: 100%; padding: 14px 16px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 14px; color: #fff; margin-bottom: 16px; outline: none; }
    .form-input:focus { border-color: var(--accent); }

    /* ── Buttons ── */
    .btn { padding: 12px 24px; border-radius: 99px; border: none; font-weight: 600; cursor: pointer; transition: 0.3s; }
    .btn-primary { background: var(--text); color: #000; }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--border); }
    .btn-xs { padding: 8px 14px; font-size: 0.8rem; }

    /* 📱 Mobile Responsive */
    @media (max-width: 768px) {
      header { padding: 16px 5%; }
      nav { display: none; /* 简化手机顶部，使用底部导航或折叠更好，这里暂且隐藏文字菜单，只留Logo和登录 */ }
      .search-wrapper { flex-direction: column; padding: 15px; }
      .search-wrapper .btn-primary { padding: 16px; width: 100%; }
      .waterfall { column-count: 2; column-gap: 12px; } /* 小红书双列 */
      .post-content { padding: 12px; }
      .post-title { font-size: 0.95rem; }
      .fab { bottom: 30px; right: 20px; width: 55px; height: 55px; }
    }

    #toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 12px 28px; border-radius: 50px; font-weight: 700; z-index: 3000; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  </style>
</head>
<body>

<header>
  <div class="logo" onclick="showSection('jobs')">Play<span>Job</span></div>
  <nav>
    <a href="#" class="active" id="nav-jobs" onclick="showSection('jobs', this)">职位广场</a>
    <a href="#" id="nav-board" onclick="showSection('board', this)">投递看板</a>
    <a href="#" id="nav-forum" onclick="showSection('forum', this)">面经社区</a>
  </nav>
  <button class="login-btn" onclick="openModal('loginModal')">登录 / 注册</button>
</header>

<main>
  <!-- 发现岗位 -->
  <section id="section-jobs" class="section active">
    <div style="margin-bottom: 30px;">
      <h1 style="font-size: 2.6rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 10px;">探索全球机遇</h1>
      <p style="color: var(--muted); font-size: 1.05rem;">聚合顶尖互联网、金融、新能源与半导体实习库</p>
    </div>
    <div class="search-wrapper">
      <input id="q-input" type="text" placeholder="搜公司、行业或技术栈..." />
      <button class="btn btn-primary" onclick="searchJobs()">搜索</button>
    </div>
    <div id="jobs-container"></div>
  </section>

  <!-- 投递看板 -->
  <section id="section-board" class="section">
    <h2 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 30px;">投递进度看板</h2>
    <div class="board-container" id="board-container"></div>
  </section>

  <!-- 面经社区 (小红书瀑布流) -->
  <section id="section-forum" class="section">
    <div style="margin-bottom: 30px;">
      <h2 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 10px;">发现真面经</h2>
      <p style="color: var(--muted);">看准同行经验，斩获 Dream Offer</p>
    </div>
    <div class="search-wrapper" style="margin-bottom: 20px;">
      <input id="forum-search" type="text" placeholder="搜索面经，例如：腾讯三面、量化真题..." />
      <button class="btn btn-primary" onclick="fetchPosts()">搜面经</button>
    </div>
    <div class="waterfall" id="posts-list">
      <!-- 瀑布流内容将在 JS 中渲染 -->
    </div>
  </section>
</main>

<!-- 悬浮操作按钮 -->
<div class="fab" onclick="handleFabClick()">+</div>

<!-- HR发布岗位弹窗 -->
<div class="modal-overlay" id="addJobModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>HR 发布岗位</h3>
      <button class="btn-close" onclick="closeModal('addJobModal')">&times;</button>
    </div>
    <input class="form-input" id="hr-company" placeholder="公司名称 (如：字节跳动)" />
    <input class="form-input" id="hr-title" placeholder="岗位名称 (如：前端实习生)" />
    <input class="form-input" id="hr-location" placeholder="工作地点" />
    <input class="form-input" id="hr-url" placeholder="投递链接 (URL)" />
    <button class="btn btn-accent" style="width: 100%; margin-top: 10px;" onclick="submitJob()">立即发布</button>
  </div>
</div>

<!-- 发布面经弹窗 -->
<div class="modal-overlay" id="addPostModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>分享经验</h3>
      <button class="btn-close" onclick="closeModal('addPostModal')">&times;</button>
    </div>
    <input class="form-input" id="post-title" placeholder="吸引人的标题..." />
    <textarea class="form-input" id="post-content" placeholder="分享你的面试真题和心得..." style="height: 120px; resize: none;"></textarea>
    <button class="btn btn-accent" style="width: 100%; margin-top: 10px;" onclick="createPost()">发布帖子</button>
  </div>
</div>

<!-- 登录/注册弹窗 -->
<div class="modal-overlay" id="loginModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>欢迎来到 PlayJob</h3>
      <button class="btn-close" onclick="closeModal('loginModal')">&times;</button>
    </div>
    <p style="color:var(--muted); margin-bottom: 20px; font-size: 0.9rem;">登录以同步您的投递看板与收藏数据。</p>
    <input class="form-input" type="email" placeholder="邮箱账号" />
    <input class="form-input" type="password" placeholder="密码" />
    <button class="btn btn-primary" style="width: 100%; margin-top: 10px;" onclick="simLogin()">一键登录</button>
  </div>
</div>

<div id="toast"></div>

<script>
const API_BASE = 'https://intern-api-16ja.onrender.com/api';
let currentSection = 'jobs';

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

function showSection(name, el) {
  currentSection = name;
  if(el) {
    document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
    el.classList.add('active');
  }
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(`section-${name}`).classList.add('active');
  if(name === 'board') fetchBoard();
  if(name === 'forum') fetchPosts();
}

// FAB 逻辑：根据当前页面决定发布什么
function handleFabClick() {
  if (currentSection === 'jobs') {
    openModal('addJobModal');
  } else if (currentSection === 'forum') {
    openModal('addPostModal');
  } else {
    showToast('看板页面无需发布');
  }
}

function simLogin() {
  showToast('✅ 登录成功 (UI预览)');
  closeModal('loginModal');
  document.querySelector('.login-btn').textContent = '我的账户';
}

/* ── 岗位逻辑 ── */
async function searchJobs() {
  const q = document.getElementById('q-input').value.trim();
  const container = document.getElementById('jobs-container');
  container.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--muted);">🚀 正在检索海量企业...</div>';
  
  try {
    const res = await fetch(`${API_BASE}/live-search?q=${encodeURIComponent(q)}`);
    const { data } = await res.json();
    if(!data.length) { container.innerHTML = '<div style="grid-column:1/-1; color:var(--muted); text-align:center;">暂无匹配，换个词试试？</div>'; return; }

    container.innerHTML = data.map(job => `
      <div class="job-card">
        <div class="company">${job.company}</div>
        <div class="title">${job.title}</div>
        <div class="tags">
          <span class="tag">📍 ${job.location || '全国'}</span>
          ${(job.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}
        </div>
        <div style="display:flex; gap:10px; margin-top:auto;">
          <button class="btn btn-accent btn-xs" style="flex:1;" onclick="window.open('${job.sourceUrl}')">查看详情</button>
          <button class="btn btn-secondary btn-xs" onclick="addToBoard('${job.company}', '${job.title}', '${job.location}', '${job.sourceUrl}')">加入看板</button>
        </div>
      </div>
    `).join('');
  } catch (err) { container.innerHTML = '<div style="grid-column:1/-1; color:var(--danger); text-align:center;">网络异常，请重试</div>'; }
}

async function submitJob() {
  const company = document.getElementById('hr-company').value;
  const title = document.getElementById('hr-title').value;
  if(!company || !title) return showToast('公司和岗位为必填');
  // 模拟提交
  showToast('✅ 岗位发布成功，将进行审核');
  closeModal('addJobModal');
  searchJobs();
}

async function addToBoard(c, t, l, s) {
  try {
    await fetch(`${API_BASE}/applications`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ company:c, title:t, location:l, sourceUrl:s }) });
    showToast('✅ 加入看板成功');
  } catch(e) { showToast('❌ 加入失败'); }
}

/* ── 看板逻辑 ── */
async function fetchBoard() {
  const container = document.getElementById('board-container');
  const STATUS_NAME = { applied: '投递', interview: '面试', offer: '录取', reject: '淘汰' };
  try {
    const res = await fetch(`${API_BASE}/applications`);
    const { board } = await res.json();
    container.innerHTML = Object.keys(STATUS_NAME).map(status => `
      <div class="board-column">
        <h3>${STATUS_NAME[status]} <span>${board[status]?.length || 0}</span></h3>
        ${(board[status] || []).map(item => `
          <div class="app-card">
            <button class="btn-delete" onclick="delApp('${item._id}')">×</button>
            <div style="font-weight:700; font-size:0.95rem; margin-bottom:5px; padding-right:15px;">${item.title}</div>
            <div style="color:var(--muted); font-size:0.8rem; margin-bottom:12px;">${item.company}</div>
            <div style="display:flex; gap:5px; flex-wrap:wrap;">
              ${Object.keys(STATUS_NAME).filter(s => s !== status).map(s => 
                `<button class="btn btn-secondary btn-xs" style="font-size:0.65rem;" onclick="updateApp('${item._id}', '${s}')">${STATUS_NAME[s]}</button>`
              ).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    `).join('');
  } catch(e) {}
}

async function updateApp(id, status) { await fetch(`${API_BASE}/applications/${id}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({status})}); fetchBoard(); }
async function delApp(id) { if(confirm('移除记录？')) { await fetch(`${API_BASE}/applications/${id}`, { method:'DELETE' }); fetchBoard(); } }

/* ── 论坛逻辑 (模拟小红书数据渲染) ── */
async function fetchPosts() {
  const container = document.getElementById('posts-list');
  const q = document.getElementById('forum-search').value;
  
  // 这里我们用前端 Mock 一些带有小红书风格的数据展示 UI 效果
  // 当你的后端完善了相关字段，就可以直接替换为 res.json()
  const mockData = [
    { title: "腾讯光子引擎组一面面经", desc: "全程拷问C++底层和图形学，面试官人很好，最后手撕了一个光线追踪的小算法...", likes: 342, author: "游戏狂人", cover: "🎮" },
    { title: "拿了Citadel的Offer，薪水有多夸张？", desc: "Base很高，Sign-on更离谱，准备去香港打工了，给学弟学妹分享一下准备量化面试的历程。", likes: 1289, author: "Quant老哥", cover: "📈" },
    { title: "字节跳动日常实习记录", desc: "食堂真的太好吃了！每天胖一斤的节奏，顺便分享一下组内的氛围和技术栈。", likes: 89, author: "干饭王", cover: "🍱" },
    { title: "大模型赛道：月之暗面算法岗", desc: "刚结束Kimi的面试，偏重对Transformer架构的理解和分布式训练经验的考察。", likes: 456, author: "AI搬砖客", cover: "🤖" },
    { title: "四大咨询PTA日常打杂日记", desc: "每天都在画PPT和做冷呼，但感觉眼界确实开阔了不少，推荐大一大二来试试水。", likes: 231, author: "职场萌新", cover: "💼" },
    { title: "米哈游 TA (技术美术) 面试分享", desc: "需要懂渲染管线，又要懂一点美术工具链开发，挺有挑战的。", likes: 567, author: "二次元代码", cover: "🎨" }
  ];

  container.innerHTML = mockData.map(post => `
    <div class="post-card">
      <div class="post-cover">${post.cover}</div>
      <div class="post-content">
        <div class="post-title">${post.title}</div>
        <div class="post-desc">${post.desc}</div>
        <div class="post-footer">
          <div class="author-info"><div class="avatar"></div> <span>${post.author}</span></div>
          <div class="post-actions"><span onclick="showToast('❤️ 点赞成功')">🤍 ${post.likes}</span></div>
        </div>
      </div>
    </div>
  `).join('');
}

async function createPost() {
  showToast('✅ 帖子发布成功 (需后端支持持久化)');
  closeModal('addPostModal');
  fetchPosts();
}

searchJobs();
</script>
</body>
</html>
