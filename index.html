<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayJob — 探索你的无限可能</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Apple 风格极简变量 ── */
    :root {
      --bg: #000000;
      --surface: rgba(28, 28, 30, 0.6);
      --surface-solid: #1c1c1e;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #2997ff;
      --accent-hover: #0071e3;
      --text: #f5f5f7;
      --muted: #86868b;
      --danger: #ff3b30;
      --warn: #ff9f0a;
      --success: #32d74b;
      --radius: 18px;
      --apple-bezier: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── Header ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 48px; position: sticky; top: 0;
      background: rgba(0, 0, 0, 0.8); backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border); z-index: 100;
    }
    .logo { 
      font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.5rem; letter-spacing: -0.5px; 
      cursor: pointer; transition: 0.3s;
    }
    .logo:hover { text-shadow: 0 0 15px rgba(41, 151, 255, 0.5); }
    .logo span { color: var(--accent); }
    nav a { color: var(--muted); text-decoration: none; margin-left: 32px; font-size: 0.9rem; font-weight: 500; transition: 0.3s; }
    nav a:hover, nav a.active { color: var(--text); }

    /* ── 布局与通用 ── */
    main { max-width: 1200px; margin: 0 auto; padding: 40px 24px 100px; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
    .section-header h2 { font-size: 2.2rem; font-weight: 700; letter-spacing: -1px; }
    .section { display: none; }
    .section.active { display: block; animation: fadeIn 0.6s var(--apple-bezier); }
    
    @keyframes fadeIn { 
      from { opacity: 0; transform: translateY(20px); } 
      to { opacity: 1; transform: translateY(0); } 
    }

    /* ── 按钮与表单 ── */
    .btn { padding: 12px 24px; border: none; border-radius: 999px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: all 0.3s var(--apple-bezier); }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--text); color: var(--bg); }
    .btn-primary:hover { background: #ffffff; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255,255,255,0.2); }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-accent:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(41,151,255,0.3); }
    .btn-secondary { background: var(--surface-solid); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); }
    .btn-xs { padding: 8px 16px; font-size: 0.8rem; border-radius: 10px; }

    input, textarea {
      padding: 14px 18px; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      border-radius: 14px; color: var(--text); font-size: 1rem; outline: none; transition: 0.3s var(--apple-bezier);
    }
    input:focus, textarea:focus { border-color: var(--accent); background: rgba(255,255,255,0.1); box-shadow: 0 0 0 4px rgba(41, 151, 255, 0.1); }
    
    .search-bar { display: flex; gap: 12px; margin-bottom: 50px; }
    .search-bar input { flex: 1; backdrop-filter: blur(10px); }

    /* ── 岗位卡片入场动画 ── */
    #jobs-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }
    .job-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 28px; transition: all 0.5s var(--apple-bezier); backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex; flex-direction: column; height: 100%;
      animation: cardSlideUp 0.6s var(--apple-bezier) backwards;
    }
    @keyframes cardSlideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .job-card:hover { 
      border-color: rgba(255,255,255,0.3); transform: translateY(-8px) scale(1.01); 
      box-shadow: 0 20px 40px rgba(0,0,0,0.5); 
      background: rgba(45, 45, 48, 0.8); 
    }
    .job-card .company { font-size: 0.8rem; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .job-card .job-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 14px; line-height: 1.3; }
    .job-card .meta { display: flex; align-items: center; gap: 12px; font-size: 0.85rem; color: var(--muted); margin-bottom: auto; padding-bottom: 20px; }
    .job-card .meta span:last-child { background: rgba(41, 151, 255, 0.1); color: var(--accent); padding: 2px 8px; border-radius: 4px; }
    .tag { padding: 5px 12px; border-radius: 8px; font-size: 0.75rem; background: rgba(255,255,255,0.06); color: var(--muted); font-weight: 500; }

    /* ── 看板与论坛 ── */
    .board-grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .board-column { background: var(--surface-solid); border: 1px solid var(--border); border-radius: 24px; padding: 20px; min-height: 400px; }
    .app-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 15px; transition: 0.3s; }
    .app-card:hover { background: rgba(255,255,255,0.06); }
    
    .panel { background: var(--surface-solid); border: 1px solid var(--border); border-radius: 24px; padding: 30px; }
    .post-item { background: rgba(255,255,255,0.03); border-radius: 18px; padding: 20px; margin-bottom: 16px; border: 1px solid transparent; transition: 0.3s; }
    .post-item:hover { border-color: var(--border); transform: translateX(5px); }

    /* ── 弹窗增强 ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.4s var(--apple-bezier); z-index: 999; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content { background: #1c1c1e; border: 1px solid var(--border); border-radius: 32px; width: 90%; max-width: 480px; padding: 40px; transform: scale(0.8); transition: 0.5s var(--apple-bezier); }
    .modal-overlay.active .modal-content { transform: scale(1); }

    /* ── 状态反馈 ── */
    #toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(100px); background: #ffffff; color: #000000; padding: 14px 28px; border-radius: 999px; font-size: 0.95rem; font-weight: 600; transition: 0.5s var(--apple-bezier); z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* 响应式优化 */
    @media (max-width: 768px) {
      header { padding: 16px 24px; }
      nav a { margin-left: 16px; font-size: 0.8rem; }
      .search-bar { flex-direction: column; }
      .section-header h2 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo" onclick="showSection('jobs')">Play<span>Job</span></div>
  <nav>
    <a href="#" class="active" onclick="showSection('jobs', this)">发现岗位</a>
    <a href="#" onclick="showSection('board', this)">我的看板</a>
    <a href="#" onclick="showSection('forum', this)">面经论坛</a>
  </nav>
</header>

<main>
  <!-- 岗位页 -->
  <section id="section-jobs" class="section active">
    <div class="section-header">
      <h2>探索实习机会</h2>
      <button class="btn btn-accent" onclick="openModal()">＋ 录入新岗位</button>
    </div>
    <div class="search-bar">
      <input id="search-company" type="text" placeholder="搜公司: 字节, 腾讯..." />
      <input id="search-title" type="text" placeholder="搜职位: 前端, 后端, AI..." />
      <button class="btn btn-primary" onclick="fetchJobs()">即刻搜索</button>
      <button class="btn btn-secondary" onclick="clearSearch()">重置</button>
    </div>
    <div id="jobs-container"></div>
  </section>

  <!-- 看板页 -->
  <section id="section-board" class="section">
    <div class="section-header">
      <h2>投递进度看板</h2>
      <button class="btn btn-secondary" onclick="fetchBoard()">刷新状态</button>
    </div>
    <div class="board-grid" id="board-container"></div>
  </section>

  <!-- 论坛页 -->
  <section id="section-forum" class="section">
    <div class="section-header">
      <h2>面经交流社区</h2>
    </div>
    <div class="forum-layout">
      <div class="panel">
        <h3 style="margin-bottom:20px; font-weight: 700;">发布面经</h3>
        <input id="post-title" placeholder="标题: 某厂三轮面经分享" style="width:100%; margin-bottom:15px;" />
        <textarea id="post-content" placeholder="在这里写下你的面试细节..." style="width:100%; height:180px; margin-bottom:20px; resize:none;"></textarea>
        <button class="btn btn-primary" style="width:100%;" onclick="createPost()">立即发布</button>
      </div>
      <div class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
          <h3 style="font-weight: 700;">最新讨论</h3>
          <button class="btn btn-secondary btn-xs" onclick="fetchPosts()">刷新</button>
        </div>
        <div id="posts-container"></div>
      </div>
    </div>
  </section>
</main>

<!-- 手动录入弹窗 -->
<div class="modal-overlay" id="addJobModal">
  <div class="modal-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:32px;">
      <h3 style="font-size:1.6rem; font-weight: 800; letter-spacing: -1px;">分享岗位</h3>
      <button onclick="closeModal()" style="background:none; border:none; color:var(--muted); font-size:2rem; cursor:pointer;">&times;</button>
    </div>
    <div class="form-group"><label>公司名称 *</label><input id="manual-company" type="text" placeholder="如：小米" /></div>
    <div class="form-group"><label>职位名称 *</label><input id="manual-title" type="text" placeholder="如：系统研发实习生" /></div>
    <div class="form-group"><label>工作地点</label><input id="manual-location" type="text" placeholder="北京 / 远程" /></div>
    <div class="form-group"><label>投递链接 (选填)</label><input id="manual-url" type="text" placeholder="https://..." /></div>
    <button class="btn btn-accent" style="width:100%; margin-top:20px; padding: 16px;" onclick="submitManualJob()">发布至广场</button>
  </div>
</div>

<div id="toast"></div>

<script>
const API_BASE = 'https://intern-api-16ja.onrender.com/api';

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

async function apiFetch(path, options = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    headers: { 'Content-Type': 'application/json', ...options.headers },
    ...options,
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

function showSection(name, el) {
  document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
  if(el) {
    el.classList.add('active');
  } else {
    document.querySelector(`nav a[onclick*="${name}"]`).classList.add('active');
  }
  
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(`section-${name}`).classList.add('active');

  if (name === 'jobs') fetchJobs();
  if (name === 'board') fetchBoard();
  if (name === 'forum') fetchPosts();
}

/* ── 1. 发现岗位 ── */
async function fetchJobs() {
  const container = document.getElementById('jobs-container');
  const company = document.getElementById('search-company').value.trim();
  const title = document.getElementById('search-title').value.trim();
  const query = `${company} ${title}`.trim();

  if (query) {
    container.innerHTML = `
      <div style="grid-column: 1/-1; text-align: center; padding: 80px 0;">
        <div style="font-size: 2rem; margin-bottom: 20px;">🚀</div>
        <div style="color: var(--accent); font-weight: 700; font-size: 1.2rem; margin-bottom: 8px;">正在深空搜索最新职位...</div>
        <div style="color: var(--muted);">正在为您聚合全网最实时的实习信息</div>
      </div>
    `;

    try {
      const data = await apiFetch(`/live-search?q=${encodeURIComponent(query)}`);
      renderJobCards(data.data || [], true);
    } catch (err) {
      container.innerHTML = '<div style="color:var(--danger); grid-column:1/-1; text-align:center;">搜索暂时不可用，请稍后刷新。</div>';
    }
  } else {
    container.innerHTML = '<div style="color:var(--muted); grid-column:1/-1; text-align:center; padding: 50px;">正在加载精选岗位...</div>';
    try {
      const data = await apiFetch(`/jobs?page=1&limit=50`);
      renderJobCards(data.data || [], false);
    } catch (err) {
      container.innerHTML = '<div style="color:var(--danger); grid-column:1/-1; text-align:center;">无法连接到数据库，请检查后端状态。</div>';
    }
  }
}

function renderJobCards(jobs, isLive) {
  const container = document.getElementById('jobs-container');
  if (jobs.length === 0) {
    container.innerHTML = '<div style="color:var(--muted); grid-column:1/-1; text-align:center; padding: 50px;">未发现匹配岗位，换个关键词试试？</div>';
    return;
  }
  
  container.innerHTML = jobs.map((job, index) => `
    <div class="job-card" style="animation-delay: ${index * 0.05}s" onclick="window.open('${job.sourceUrl || '#'}', '_blank')">
      <div class="company">${escapeHtml(job.company)}</div>
      <div class="job-title">${escapeHtml(job.title)}</div>
      <div class="meta">
        <span>📍 ${escapeHtml(job.location || '未知')}</span>
        <span>${isLive ? '🌐 实时检索' : '✨ 云端精选'}</span>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px;">
        ${(job.tags || ['最新']).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
      </div>
      <div style="display:flex; gap:12px; margin-top:auto;">
        <button class="btn btn-primary btn-xs" style="flex:1">直达申请</button>
        <button class="btn btn-secondary btn-xs" onclick="event.stopPropagation(); applyJob('${job._id || 'manual'}')">加入看板</button>
      </div>
    </div>
  `).join('');
}

function clearSearch() {
  document.getElementById('search-company').value = '';
  document.getElementById('search-title').value = '';
  fetchJobs();
}

function openModal() { document.getElementById('addJobModal').classList.add('active'); }
function closeModal() { document.getElementById('addJobModal').classList.remove('active'); }

async function submitManualJob() {
  const company = document.getElementById('manual-company').value.trim();
  const title = document.getElementById('manual-title').value.trim();
  if (!company || !title) return showToast('⚠️ 请填写必填项');

  try {
    await apiFetch('/jobs', {
      method: 'POST',
      body: JSON.stringify({
        company, title, 
        location: document.getElementById('manual-location').value.trim() || '不限',
        sourceUrl: document.getElementById('manual-url').value.trim(),
        tags: ['社区录入']
      })
    });
    showToast('✅ 岗位已成功录入');
    closeModal();
    fetchJobs();
  } catch (err) {
    showToast('❌ 录入失败');
  }
}

/* ── 2. 我的看板 ── */
async function applyJob(jobId) {
  // 这里的逻辑需要确保把当前卡片的岗位信息发给后端
  // 建议直接获取卡片数据并发送
  const jobCard = event.target.closest('.job-card');
  const jobData = {
    company: jobCard.querySelector('.company').innerText,
    title: jobCard.querySelector('.job-title').innerText,
    location: jobCard.querySelector('.meta span').innerText.replace('📍 ', ''),
    sourceUrl: jobCard.getAttribute('onclick').match(/'([^']+)'/)[1], // 提取 URL
    applicantName: '我'
  };

  try {
    await apiFetch('/applications', { 
      method: 'POST', 
      body: JSON.stringify(jobData) 
    });
    showToast('✅ 已成功加入看板！');
  } catch (err) {
    showToast(`❌ 加入失败：${err.message}`);
  }
}

const APP_STATUS = ['applied', 'interview', 'offer', 'reject'];
const STATUS_NAME = { applied: '已投递', interview: '面试中', offer: '已录取', reject: '淘汰' };

async function fetchBoard() {
  const container = document.getElementById('board-container');
  try {
    const data = await apiFetch('/applications');
    const board = data.board || {};
    
    container.innerHTML = APP_STATUS.map(status => {
      const list = board[status] || [];
      const cards = list.map(item => {
        const job = item.job || {};
        return `
          <div class="app-card">
            <div class="title">${escapeHtml(job.title || '未知岗位')}</div>
            <div class="meta" style="margin-bottom:12px;">${escapeHtml(job.company || '未知公司')}</div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px;">
              ${APP_STATUS.filter(s => s !== status).map(s => 
                `<button class="btn-secondary btn-xs" onclick="updateApp('${item._id}', '${s}')">${STATUS_NAME[s]}</button>`
              ).join('')}
              <button class="btn-secondary btn-xs" style="color:var(--danger); grid-column: span 2; margin-top:4px;" onclick="deleteApp('${item._id}')">移除</button>
            </div>
          </div>`;
      }).join('');

      return `
        <div class="board-column">
          <h3 style="font-weight:700;">${STATUS_NAME[status]} <span class="pill pill-${status}">${list.length}</span></h3>
          <div style="margin-top:20px;">${cards || '<div style="color:var(--muted); text-align:center; padding:20px; font-size:0.8rem;">空</div>'}</div>
        </div>`;
    }).join('');
  } catch (err) {
    container.innerHTML = '看板加载失败';
  }
}

async function updateApp(id, status) {
  try { await apiFetch(`/applications/${id}`, { method: 'PUT', body: JSON.stringify({ status }) }); fetchBoard(); } catch(err) { showToast('❌ 操作失败'); }
}
async function deleteApp(id) {
  if(!confirm('确定要删除这条记录吗？')) return;
  try { await apiFetch(`/applications/${id}`, { method: 'DELETE' }); fetchBoard(); showToast('🗑️ 记录已删除'); } catch(err) { showToast('❌ 删除失败'); }
}

/* ── 3. 面经论坛 ── */
async function fetchPosts() {
  const container = document.getElementById('posts-container');
  try {
    const data = await apiFetch(`/posts?page=1&limit=20`);
    const posts = data.data || [];
    if (!posts.length) { container.innerHTML = '<div style="color:var(--muted); text-align:center; padding:40px;">暂无讨论</div>'; return; }

    container.innerHTML = posts.map(post => `
      <div class="post-item">
        <div class="title">${escapeHtml(post.title)}</div>
        <div style="color:var(--text); font-size:0.9rem; line-height:1.6; margin:10px 0; opacity:0.8;">${escapeHtml(post.content).substring(0, 100)}...</div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:15px;">
          <div style="font-size:0.8rem; color:var(--muted);">👀 ${post.views || 0} · 👍 ${post.likes || 0}</div>
          <button class="btn btn-secondary btn-xs" onclick="likePost('${post._id}')">👍 赞</button>
        </div>
      </div>
    `).join('');
  } catch (err) { container.innerHTML = '加载失败'; }
}

async function createPost() {
  const title = document.getElementById('post-title').value.trim();
  const content = document.getElementById('post-content').value.trim();
  if (!title || !content) return showToast('⚠️ 标题和内容不能为空');
  try {
    await apiFetch('/posts', { method: 'POST', body: JSON.stringify({ author:'匿名用户', title, content, tags:['面经'] }) });
    showToast('✅ 帖子已发布');
    document.getElementById('post-title').value = '';
    document.getElementById('post-content').value = '';
    fetchPosts();
  } catch (err) { showToast('❌ 发布失败'); }
}

async function likePost(id) {
  try { await apiFetch(`/posts/${id}/like`, { method: 'PUT' }); fetchPosts(); } catch(err) {}
}

// 启动
fetchJobs();
</script>
</body>
</html>
