<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayJob — 探索你的无限可能</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Apple 风格极简变量 ── */
    :root {
      --bg: #000000;
      --surface: rgba(28, 28, 30, 0.6);
      --surface-solid: #1c1c1e;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #2997ff; /* Apple 经典蓝 */
      --accent-hover: #0071e3;
      --text: #f5f5f7;
      --muted: #86868b;
      --danger: #ff3b30;
      --warn: #ff9f0a;
      --success: #32d74b;
      --radius: 18px;
      --apple-bezier: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Apple 专属字体栈 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header 毛玻璃效果 ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 48px;
      position: sticky;
      top: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      transition: all 0.3s var(--apple-bezier);
    }
    .logo {
      font-family: 'Syne', -apple-system, sans-serif;
      font-weight: 800;
      font-size: 1.5rem;
      color: var(--text);
      letter-spacing: -0.5px;
    }
    .logo span { color: var(--accent); }

    nav a {
      color: var(--muted);
      text-decoration: none;
      margin-left: 32px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.3s ease;
    }
    nav a:hover, nav a.active { color: var(--text); }

    /* ── 主体布局 ── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 24px 100px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }
    .section-header h2 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    /* ── Apple 风格按钮 ── */
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 999px; /* 胶囊按钮 */
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.3s var(--apple-bezier);
    }
    .btn:active { transform: scale(0.95); }
    .btn-primary { background: var(--text); color: var(--bg); }
    .btn-primary:hover { background: #ffffff; transform: scale(1.02); }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-accent:hover { background: var(--accent-hover); transform: scale(1.02); }
    .btn-secondary { background: var(--surface-solid); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); }

    /* ── 搜索与过滤 ── */
    .search-bar { display: flex; gap: 12px; margin-bottom: 40px; flex-wrap: wrap; }
    .search-bar input {
      flex: 1;
      min-width: 200px;
      padding: 14px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s var(--apple-bezier);
      backdrop-filter: blur(10px);
    }
    .search-bar input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(41, 151, 255, 0.15); }
    
    /* ── Apple 风格卡片 (悬浮缩放) ── */
    #jobs-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }
    .job-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      transition: all 0.4s var(--apple-bezier);
      cursor: pointer;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .job-card:hover {
      border-color: rgba(255,255,255,0.2);
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      background: rgba(40, 40, 44, 0.8);
    }
    .job-card .company {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .job-card .job-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.3px;
    }
    .job-card .meta {
      display: flex;
      gap: 16px;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 20px;
    }
    .tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag {
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 500;
      background: rgba(255,255,255,0.08);
      color: var(--text);
    }
    .job-card .actions { margin-top: 20px; display: flex; gap: 10px; }
    .btn-xs { padding: 8px 16px; font-size: 0.85rem; border-radius: 8px; }

    /* ── 手动录入弹窗 (Modal) ── */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s var(--apple-bezier);
      z-index: 999;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content {
      background: var(--surface-solid);
      border: 1px solid var(--border);
      border-radius: 24px;
      width: 90%;
      max-width: 500px;
      padding: 32px;
      transform: scale(0.9) translateY(20px);
      transition: all 0.4s var(--apple-bezier);
      box-shadow: 0 24px 48px rgba(0,0,0,0.5);
    }
    .modal-overlay.active .modal-content { transform: scale(1) translateY(0); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .modal-header h3 { font-size: 1.4rem; font-weight: 600; }
    .close-btn { background: transparent; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; }
    .close-btn:hover { color: var(--text); }
    
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }
    .form-group input {
      width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); font-size: 0.95rem; outline: none; transition: 0.3s;
    }
    .form-group input:focus { border-color: var(--accent); }

    /* ── 通用设置 ── */
    .section { display: none; animation: fadeIn 0.5s var(--apple-bezier); }
    .section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    #toast {
      position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-20px);
      background: var(--text); color: var(--bg); padding: 12px 24px;
      border-radius: 999px; font-size: 0.95rem; font-weight: 600;
      opacity: 0; pointer-events: none; transition: all 0.4s var(--apple-bezier); z-index: 1000;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<header>
  <div class="logo">Play<span>Job</span></div>
  <nav>
    <a href="#" class="active" onclick="showSection('jobs', this); return false;">发现岗位</a>
    <a href="#" onclick="showSection('board', this); return false;">我的看板</a>
    <a href="#" onclick="showSection('forum', this); return false;">面经论坛</a>
  </nav>
</header>

<main>
  <!-- 岗位页 -->
  <section id="section-jobs" class="section active">
    <div class="section-header">
      <h2>探索实习机会</h2>
      <button class="btn btn-accent" onclick="openModal()">＋ 录入新岗位</button>
    </div>

    <div class="search-bar">
      <input id="search-company" type="text" placeholder="搜索公司 (如: 腾讯, 大疆)..." />
      <input id="search-title"   type="text" placeholder="搜索职位 (如: 产品经理)..." />
      <button class="btn btn-primary" onclick="fetchJobs(1)">搜索</button>
      <button class="btn btn-secondary" onclick="clearSearch()">重置</button>
    </div>

    <div id="jobs-container"></div>
  </section>

  <!-- 看板页 (简略结构) -->
  <section id="section-board" class="section">
    <div class="section-header">
      <h2>投递看板</h2>
    </div>
    <div style="color:var(--muted); text-align:center; margin-top:50px;">看板功能模块加载中...</div>
  </section>

  <!-- 论坛页 (简略结构) -->
  <section id="section-forum" class="section">
    <div class="section-header">
      <h2>面经论坛</h2>
    </div>
    <div style="color:var(--muted); text-align:center; margin-top:50px;">论坛功能模块加载中...</div>
  </section>
</main>

<!-- 手动录入弹窗 -->
<div class="modal-overlay" id="addJobModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>分享岗位信息</h3>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>
    <div class="form-group">
      <label>公司名称 *</label>
      <input id="manual-company" type="text" placeholder="例如：蔚来汽车" />
    </div>
    <div class="form-group">
      <label>职位名称 *</label>
      <input id="manual-title" type="text" placeholder="例如：电池结构研发工程师" />
    </div>
    <div class="form-group">
      <label>工作地点</label>
      <input id="manual-location" type="text" placeholder="例如：上海 / 远程" />
    </div>
    <div class="form-group">
      <label>投递链接 (选填)</label>
      <input id="manual-url" type="text" placeholder="https://..." />
    </div>
    <button class="btn btn-accent" style="width: 100%; margin-top: 10px;" onclick="submitManualJob()">发布至广场</button>
  </div>
</div>

<div id="toast"></div>

<script>
const API_BASE = 'https://intern-api-16ja.onrender.com/api';

// ── Apple 风格 Toast ──
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

// ── API 封装 ──
async function apiFetch(path, options = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    headers: { 'Content-Type': 'application/json', ...options.headers },
    ...options,
  });
  if (!res.ok) throw new Error(`请求失败: ${res.status}`);
  return res.json();
}

// ── 获取并渲染岗位 ──
async function fetchJobs() {
  const container = document.getElementById('jobs-container');
  container.innerHTML = '<div style="color:#86868b;">正在同步云端数据...</div>';
  
  const company = document.getElementById('search-company').value.trim();
  const title = document.getElementById('search-title').value.trim();
  const params = new URLSearchParams({ page: 1, limit: 100 });
  if (company) params.set('company', company);
  if (title) params.set('title', title);

  try {
    const data = await apiFetch(`/jobs?${params}`);
    const jobs = data.data || [];
    
    if (!jobs.length) {
      container.innerHTML = '<div style="color:#86868b;">暂无数据，试着点击右上角录入一个吧！</div>';
      return;
    }

    container.innerHTML = jobs.map(job => `
      <div class="job-card" onclick="window.open('${job.sourceUrl || '#'}', '_blank')">
        <div class="company">${job.company}</div>
        <div class="job-title">${job.title}</div>
        <div class="meta">
          <span>📍 ${job.location || '未知'}</span>
          <span>✨ 网友分享/自动抓取</span>
        </div>
        <div class="tag-list">
          ${(job.tags || ['最新岗位']).map(t => `<span class="tag">${t}</span>`).join('')}
        </div>
        <div class="actions">
          <button class="btn btn-secondary btn-xs" onclick="event.stopPropagation(); showToast('功能开发中：加入看板')">加入我的看板</button>
        </div>
      </div>
    `).join('');
  } catch (err) {
    container.innerHTML = `<div style="color:#ff3b30;">网络开小差了，请确认后端已唤醒。</div>`;
  }
}

// ── 弹窗逻辑 ──
function openModal() { document.getElementById('addJobModal').classList.add('active'); }
function closeModal() { document.getElementById('addJobModal').classList.remove('active'); }

// ── 提交手动录入的岗位 ──
async function submitManualJob() {
  const company = document.getElementById('manual-company').value.trim();
  const title = document.getElementById('manual-title').value.trim();
  const location = document.getElementById('manual-location').value.trim() || '未知';
  const url = document.getElementById('manual-url').value.trim();

  if (!company || !title) {
    showToast('⚠️ 公司和职位名称是必填的哦！');
    return;
  }

  try {
    // 调用后端接口将手动录入的数据存入数据库
    await apiFetch('/jobs', {
      method: 'POST',
      body: JSON.stringify({
        company: company,
        title: title,
        location: location,
        sourceUrl: url,
        tags: ['人工录入', '最新分享']
      })
    });
    
    showToast('✅ 发布成功！已同步至云端');
    closeModal();
    // 清空表单
    document.getElementById('manual-company').value = '';
    document.getElementById('manual-title').value = '';
    document.getElementById('manual-location').value = '';
    document.getElementById('manual-url').value = '';
    // 重新拉取数据
    fetchJobs();
  } catch (err) {
    showToast('❌ 发布失败，请确认后端支持 POST /jobs 接口');
  }
}

// ── 导航切换 ──
function showSection(name, el) {
  document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(`section-${name}`).classList.add('active');
}

function clearSearch() {
  document.getElementById('search-company').value = '';
  document.getElementById('search-title').value = '';
  fetchJobs();
}

// 页面加载即拉取数据
fetchJobs();
</script>
</body>
</html>
