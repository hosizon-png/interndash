<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PlayJob — 探索你的无限可能</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Apple 风格极简变量 ── */
    :root {
      --bg: #000000;
      --surface: rgba(28, 28, 30, 0.6);
      --surface-solid: #1c1c1e;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #2997ff;
      --accent-hover: #0071e3;
      --text: #f5f5f7;
      --muted: #86868b;
      --danger: #ff3b30;
      --radius: 18px;
      --apple-bezier: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 48px; position: sticky; top: 0;
      background: rgba(0, 0, 0, 0.8); backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border); z-index: 100;
    }
    .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.5rem; cursor: pointer; }
    .logo span { color: var(--accent); }
    nav a { color: var(--muted); text-decoration: none; margin-left: 32px; font-size: 0.9rem; transition: 0.3s; }
    nav a.active { color: var(--text); font-weight: 600; }

    main { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }
    .section { display: none; }
    .section.active { display: block; animation: fadeIn 0.6s var(--apple-bezier); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* 搜索区域 */
    .search-bar { display: flex; gap: 12px; margin-bottom: 40px; }
    .search-bar input { flex: 1; padding: 14px; background: var(--surface-solid); border: 1px solid var(--border); border-radius: 12px; color: #fff; outline: none; }
    
    /* 响应式网格 */
    #jobs-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    
    .job-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 24px; transition: 0.3s; display: flex; flex-direction: column;
    }
    .job-card:hover { transform: translateY(-5px); border-color: var(--accent); }
    .job-card .company { color: var(--accent); font-weight: 700; font-size: 0.8rem; margin-bottom: 8px; }
    .job-card .job-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 15px; }
    .job-card .tag { display: inline-block; padding: 4px 10px; background: rgba(255,255,255,0.05); border-radius: 6px; font-size: 0.75rem; color: var(--muted); margin-right: 6px; }

    .btn { padding: 10px 20px; border-radius: 99px; border: none; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .btn-primary { background: var(--text); color: #000; }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--surface-solid); color: #fff; border: 1px solid var(--border); }
    .btn-xs { padding: 6px 12px; font-size: 0.75rem; }

    /* 看板布局 */
    .board-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
    .board-column { background: var(--surface-solid); border-radius: 20px; padding: 15px; min-height: 500px; }
    .app-card { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--border); }

    /* 📱 手机端深度适配 */
    @media (max-width: 768px) {
      header { padding: 16px 20px; }
      nav a { margin-left: 12px; font-size: 0.75rem; }
      .search-bar { flex-direction: column; }
      #jobs-container { grid-template-columns: 1fr; }
      
      /* 看板变为横向滑动 */
      .board-grid { 
        display: flex; 
        overflow-x: auto; 
        padding-bottom: 20px;
        -webkit-overflow-scrolling: touch;
      }
      .board-column { min-width: 280px; flex-shrink: 0; }
    }

    #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 12px 24px; border-radius: 50px; font-weight: 700; display: none; z-index: 1000; }
  </style>
</head>
<body>

<header>
  <div class="logo" onclick="showSection('jobs')">Play<span>Job</span></div>
  <nav>
    <a href="#" class="active" onclick="showSection('jobs', this)">发现岗位</a>
    <a href="#" onclick="showSection('board', this)">投递看板</a>
  </nav>
</header>

<main>
  <!-- 发现岗位 -->
  <section id="section-jobs" class="section active">
    <div style="margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center;">
      <h2 style="font-size: 2rem;">探索机会</h2>
      <span style="color: var(--muted); font-size: 0.9rem;">💻 已接入半导体大厂数据</span>
    </div>
    <div class="search-bar">
      <input id="search-q" type="text" placeholder="搜索公司、职位或行业 (如: 芯片, 字节...)" />
      <button class="btn btn-primary" onclick="fetchJobs()">即刻搜索</button>
    </div>
    <div id="jobs-container"></div>
  </section>

  <!-- 投递看板 -->
  <section id="section-board" class="section">
    <h2 style="font-size: 2rem; margin-bottom: 30px;">我的投递</h2>
    <div class="board-grid" id="board-container"></div>
  </section>
</main>

<div id="toast"></div>

<script>
const API_BASE = 'https://intern-api-16ja.onrender.com/api';

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

function showSection(name, el) {
  document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
  if(el) el.classList.add('active');
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(`section-${name}`).classList.add('active');
  if(name === 'board') fetchBoard();
}

// 核心：抓取与渲染
async function fetchJobs() {
  const q = document.getElementById('search-q').value;
  const container = document.getElementById('jobs-container');
  container.innerHTML = '<div style="color:var(--muted)">正在为您搜寻...</div>';
  
  try {
    const res = await fetch(`${API_BASE}/live-search?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    renderJobs(data.data || []);
  } catch (err) {
    container.innerHTML = '服务连接失败';
  }
}

function renderJobs(jobs) {
  const container = document.getElementById('jobs-container');
  if(jobs.length === 0) { container.innerHTML = '未找到相关岗位'; return; }
  
  container.innerHTML = jobs.map(job => `
    <div class="job-card">
      <div class="company">${job.company}</div>
      <div class="job-title">${job.title}</div>
      <div style="margin-bottom:15px;">
        <span class="tag">📍 ${job.location || '全国'}</span>
        ${(job.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}
      </div>
      <div style="display:flex; gap:10px; margin-top:auto;">
        <button class="btn btn-accent btn-xs" style="flex:1" onclick="window.open('${job.sourceUrl}','_blank')">官网申请</button>
        <button class="btn btn-secondary btn-xs" onclick="applyToBoard('${job.company}', '${job.title}', '${job.location}', '${job.sourceUrl}')">加入看板</button>
      </div>
    </div>
  `).join('');
}

// 核心：修复“未知岗位”保存逻辑
async function applyToBoard(company, title, location, sourceUrl) {
  try {
    const res = await fetch(`${API_BASE}/applications`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ company, title, location, sourceUrl })
    });
    if(res.ok) showToast('✅ 已加入投递看板');
    else throw new Error();
  } catch (err) {
    showToast('❌ 加入失败，请重试');
  }
}

              ${Object.keys(STATUS_MAP).filter(s => s !== status).map(s => `

### 🛠️ 本次核心修复说明：

1.  **字段精准传递**：修改了 `renderJobCards`，将按钮点击事件改为直接传递字符串参数，彻底解决了数据库存入“未知岗位”的问题。
2.  **移动端深度适配**：在 CSS 中加入了复杂的媒体查询，手机端看板现在支持**横向平滑滚动**，职位卡片自动变为**单列布局**。
3.  **UI 细节优化**：增加了半导体/芯片行业的视觉标签提示。
