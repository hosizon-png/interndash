<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PlayJob — 重新定义求职体验</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050505;
      --surface: rgba(28, 28, 30, 0.6);
      --surface-solid: #1c1c1e;
      --border: rgba(255, 255, 255, 0.12);
      --accent: #2997ff;
      --text: #f5f5f7;
      --muted: #86868b;
      --danger: #ff453a;
      --radius: 20px;
      --apple-bezier: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

    /* ── Header (桌面端导航) ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 5%; position: sticky; top: 0; z-index: 1000;
      background: rgba(5, 5, 5, 0.85); backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.6rem; cursor: pointer; }
    .logo span { color: var(--accent); }
    
    .desktop-nav { display: flex; gap: 32px; align-items: center; }
    .desktop-nav a { color: var(--muted); text-decoration: none; font-size: 1rem; font-weight: 600; transition: 0.3s; padding: 6px 0; position: relative; }
    .desktop-nav a.active { color: var(--text); }
    .desktop-nav a.active::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 100%; height: 3px; background: var(--accent); border-radius: 3px; }
    .login-btn { padding: 10px 24px; background: var(--text); color: #000; border-radius: 99px; font-weight: 700; font-size: 0.95rem; cursor: pointer; border: none; transition: 0.2s; }
    .login-btn:hover { transform: scale(1.05); }

    /* ── Mobile Tab Bar (手机端底部导航) ── */
    .mobile-tab-bar {
      display: none; position: fixed; bottom: 0; left: 0; width: 100%;
      height: 70px; background: rgba(18, 18, 18, 0.9); backdrop-filter: blur(20px);
      border-top: 1px solid var(--border); z-index: 1000;
      justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom);
    }
    .tab-item { display: flex; flex-direction: column; align-items: center; color: var(--muted); text-decoration: none; font-size: 0.75rem; gap: 4px; font-weight: 500; }
    .tab-item.active { color: var(--accent); }
    .tab-icon { font-size: 1.5rem; }

    /* ── Main Layout ── */
    main { width: 100%; max-width: 1400px; margin: 0 auto; padding: 40px 5% 100px; }
    .section { display: none; width: 100%; }
    .section.active { display: block; animation: fadeIn 0.4s var(--apple-bezier); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    /* ── Search Bar (修复为横排+大字号) ── */
    .search-wrapper { 
      display: flex; flex-direction: row; align-items: center; gap: 12px; margin-bottom: 30px; width: 100%;
      background: var(--surface-solid); padding: 10px 14px; border-radius: 20px; border: 1px solid var(--border);
    }
    .search-wrapper input { flex: 1; padding: 12px 10px; background: transparent; border: none; color: #fff; font-size: 1.2rem; outline: none; }
    .search-wrapper input::placeholder { color: #777; }
    .btn-search { padding: 14px 28px; background: var(--text); color: #000; border-radius: 14px; border: none; font-weight: 700; font-size: 1.05rem; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .btn-search:active { transform: scale(0.95); }

    /* ── Job Grid ── */
    .job-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; width: 100%; }
    .job-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 24px; transition: 0.3s; display: flex; flex-direction: column; }
    .job-card:hover { border-color: var(--accent); background: rgba(45, 45, 48, 0.9); transform: translateY(-5px); }
    .job-card .company { color: var(--accent); font-weight: 800; font-size: 0.85rem; margin-bottom: 10px; text-transform: uppercase; }
    .job-card .title { font-size: 1.3rem; font-weight: 700; margin-bottom: 16px; line-height: 1.3; }

    /* ── Kanban Board (修复桌面端被截断问题) ── */
    .board-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; width: 100%; }
    .board-column { background: var(--surface-solid); border-radius: 20px; padding: 20px; min-height: 500px; display: flex; flex-direction: column; }
    .board-column h3 { font-size: 1.1rem; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
    .app-card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); position: relative; }

    /* ── 🍎 真·双列/多列瀑布流社区 (引入真图片) ── */
    .waterfall-container { width: 100%; column-count: 4; column-gap: 20px; margin-top: 20px; }
    .post-card {
      break-inside: avoid; display: inline-block; width: 100%;
      background: var(--surface-solid); border: 1px solid var(--border);
      border-radius: 20px; overflow: hidden; margin-bottom: 20px; transition: 0.3s; cursor: pointer;
    }
    .post-card:hover { transform: translateY(-6px); border-color: rgba(255,255,255,0.4); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .post-cover { width: 100%; height: 160px; object-fit: cover; display: block; background: #2c2c2e; }
    .post-body { padding: 16px; }
    .post-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 8px; line-height: 1.4; color: var(--text); }
    .post-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 0.85rem; color: var(--muted); }
    .author { display: flex; align-items: center; gap: 8px; font-weight: 500; }
    .avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }

    /* ── Modals (弹窗样式增强) ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
      display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.4s; z-index: 2000;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: #1c1c1e; border: 1px solid var(--border); border-radius: 28px;
      width: 90%; max-width: 480px; padding: 35px; transform: scale(0.9); transition: 0.4s var(--apple-bezier); max-height: 90vh; overflow-y: auto;
    }
    .modal-overlay.active .modal-box { transform: scale(1); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .modal-header h3 { font-size: 1.6rem; font-weight: 800; }
    .btn-close { background: none; border: none; color: var(--muted); font-size: 2rem; cursor: pointer; transition: 0.2s; }
    .btn-close:hover { color: #fff; }
    .form-input { width: 100%; padding: 16px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 16px; color: #fff; font-size: 1.05rem; margin-bottom: 16px; outline: none; transition: 0.3s; }
    .form-input:focus { border-color: var(--accent); background: rgba(255,255,255,0.08); }

    /* ── FAB ── */
    .fab {
      position: fixed; bottom: 100px; right: 30px; width: 60px; height: 60px;
      background: var(--text); color: #000; border-radius: 50%; font-size: 28px;
      display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 999;
      box-shadow: 0 10px 30px rgba(255,255,255,0.3); transition: 0.3s;
    }
    .fab:hover { transform: scale(1.1) rotate(90deg); background: var(--accent); color: #fff; }

    /* ── 📱 移动端专项适配 ── */
    @media (max-width: 768px) {
      header { padding: 14px 5%; }
      .desktop-nav, .login-btn { display: none; } /* 隐藏顶部导航 */
      .mobile-tab-bar { display: flex; } /* 显示底部Tab */
      main { padding: 20px 4% 110px; }
      
      /* 搜索框保持横排，但优化间距 */
      .search-wrapper { padding: 8px 10px; border-radius: 18px; margin-bottom: 24px; }
      .search-wrapper input { font-size: 1.1rem; padding: 10px 5px; }
      .btn-search { padding: 12px 20px; font-size: 1rem; border-radius: 12px; }

      /* 看板改为横向滑动，防止手机端挤成一团 */
      .board-container { display: flex; overflow-x: auto; padding-bottom: 15px; }
      .board-column { min-width: 85vw; flex-shrink: 0; }

      /* 面经双列 */
      .waterfall-container { column-count: 2; column-gap: 12px; }
      .post-cover { height: 130px; }
      .post-title { font-size: 0.95rem; }
      .fab { bottom: 90px; right: 20px; width: 54px; height: 54px; font-size: 24px; }
    }

    #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 12px 28px; border-radius: 50px; font-weight: 700; font-size: 1rem; z-index: 4000; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  </style>
</head>
<body>

<header>
  <div class="logo" onclick="showSection('jobs')">Play<span>Job</span></div>
  <nav class="desktop-nav">
    <a href="#" class="active" id="dnav-jobs" onclick="showSection('jobs', this)">职位广场</a>
    <a href="#" id="dnav-board" onclick="showSection('board', this)">投递看板</a>
    <a href="#" id="dnav-forum" onclick="showSection('forum', this)">面经社区</a>
  </nav>
  <!-- 网页端登录按钮修复 -->
  <button class="login-btn" onclick="openModal('loginModal')">登录 / 注册</button>
</header>

<div class="mobile-tab-bar">
  <a href="#" class="tab-item active" id="tab-jobs" onclick="showSection('jobs', this)">
    <span class="tab-icon">✨</span><span>发现</span>
  </a>
  <a href="#" class="tab-item" id="tab-board" onclick="showSection('board', this)">
    <span class="tab-icon">📋</span><span>看板</span>
  </a>
  <a href="#" class="tab-item" id="tab-forum" onclick="showSection('forum', this)">
    <span class="tab-icon">💬</span><span>社区</span>
  </a>
  <!-- 手机端专属“我的账户”唤醒按钮 -->
  <a href="#" class="tab-item" onclick="openModal('loginModal')">
    <span class="tab-icon">👤</span><span>我的</span>
  </a>
</div>

<main>
  <!-- 岗位广场 -->
  <section id="section-jobs" class="section active">
    <div class="search-wrapper">
      <input id="q-input" type="text" placeholder="搜大厂、AI、半导体..." />
      <button class="btn-search" onclick="searchJobs()">搜索</button>
    </div>
    <div class="job-grid" id="job-grid"></div>
  </section>

  <!-- 投递看板 -->
  <section id="section-board" class="section">
    <h2 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 24px;">我的投递</h2>
    <div class="board-container" id="board-container"></div>
  </section>

  <!-- 面经社区 -->
  <section id="section-forum" class="section">
    <div class="search-wrapper">
      <input id="f-search" type="text" placeholder="搜索真实面经 (例如: 腾讯二面、量化)..." />
      <button class="btn-search" onclick="fetchPosts()">搜经验</button>
    </div>
    <div class="waterfall-container" id="posts-list"></div>
  </section>
</main>

<div class="fab" onclick="handleFab()">+</div>
<div id="toast"></div>

<!-- 登录/注册弹窗 -->
<div class="modal-overlay" id="loginModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>探索无限可能</h3>
      <button class="btn-close" onclick="closeModal('loginModal')">&times;</button>
    </div>
    <p style="color:var(--muted); margin-bottom: 24px; font-size: 1rem; line-height: 1.5;">登录 PlayJob，一键管理海量投递记录并解锁职场社区。</p>
    <input class="form-input" type="email" placeholder="邮箱或手机号" />
    <input class="form-input" type="password" placeholder="密码" />
    <button class="btn-search" style="width: 100%; padding: 16px; margin-top: 10px;" onclick="simLogin()">一键登录 / 注册</button>
  </div>
</div>

<!-- 帖子详情弹窗 (新增) -->
<div class="modal-overlay" id="postDetailModal">
  <div class="modal-box" style="padding: 0; overflow: hidden; max-width: 550px;">
    <img id="detail-cover" src="" style="width:100%; height:240px; object-fit:cover; display:block;" />
    <div style="padding: 30px;">
      <h2 id="detail-title" style="font-size: 1.6rem; font-weight: 800; margin-bottom: 15px;">加载中...</h2>
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:20px; padding-bottom:20px; border-bottom:1px solid var(--border);">
        <img id="detail-avatar" src="" style="width:36px; height:36px; border-radius:50%; object-fit:cover;" />
        <span id="detail-author" style="font-weight:600; color:var(--muted);">Author</span>
      </div>
      <p id="detail-desc" style="font-size: 1.05rem; line-height: 1.8; color: var(--text); white-space: pre-line;">内容加载中...</p>
      <div style="margin-top: 30px; display: flex; justify-content: space-between;">
        <button class="btn-search" style="background: var(--surface-solid); color: #fff; border: 1px solid var(--border);" onclick="closeModal('postDetailModal')">关闭</button>
        <button class="btn-search" onclick="showToast('❤️ 已赞同该回答')">点赞有用</button>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'https://intern-api-16ja.onrender.com/api';
let currentTab = 'jobs';
let globalMockPosts = []; // 存储帖子数据

function showToast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

function showSection(name, el) {
  currentTab = name;
  document.querySelectorAll('.desktop-nav a, .tab-item, .section').forEach(i => i.classList.remove('active'));
  
  if (window.innerWidth > 768) {
    document.getElementById(`dnav-${name}`).classList.add('active');
  } else {
    document.getElementById(`tab-${name}`).classList.add('active');
  }
  document.getElementById(`section-${name}`).classList.add('active');

  if(name === 'board') fetchBoard();
  if(name === 'forum') fetchPosts();
}

function simLogin() {
  showToast('✅ 账户登录成功');
  closeModal('loginModal');
  document.querySelector('.login-btn').textContent = '个人中心';
}

function handleFab() { showToast('💡 后端发布接口准备中...'); }

/* ── 岗位逻辑 ── */
async function searchJobs() {
  const q = document.getElementById('q-input').value;
  const grid = document.getElementById('job-grid');
  grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--muted); font-size:1.2rem;">正在检索核心数据库...</div>';
  try {
    const res = await fetch(`${API}/live-search?q=${encodeURIComponent(q)}`);
    const { data } = await res.json();
    grid.innerHTML = data.map(j => `
      <div class="job-card">
        <div class="company">${j.company}</div>
        <div class="title">${j.title}</div>
        <div style="font-size:0.9rem; color:var(--muted); margin-bottom:20px;">📍 ${j.location || '全国'}</div>
        <div style="display:flex; gap:12px;">
          <button class="btn-search" style="flex:1; background:var(--accent); color:#fff; padding:10px;" onclick="window.open('${j.sourceUrl}')">直达官网</button>
          <button class="btn-search" style="flex:1; background:rgba(255,255,255,0.1); color:#fff; padding:10px; border:1px solid var(--border);" onclick="addBoard('${j.company}','${j.title}')">加入看板</button>
        </div>
      </div>
    `).join('');
  } catch(e) { grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:var(--danger);">连接异常</div>'; }
}

async function addBoard(company, title) {
  await fetch(`${API}/applications`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({company, title}) });
  showToast('✅ 已加入看板');
}

/* ── 看板逻辑 ── */
async function fetchBoard() {
  const container = document.getElementById('board-container');
  const STATUS = { applied:'投递', interview:'面试', offer:'录取', reject:'淘汰' };
  try {
    const res = await fetch(`${API}/applications`);
    const { board } = await res.json();
    container.innerHTML = Object.keys(STATUS).map(s => `
      <div class="board-column">
        <h3>${STATUS[s]} <span style="background:rgba(255,255,255,0.1); padding:2px 10px; border-radius:10px; color:var(--accent); font-size:0.85rem;">${board[s]?.length || 0}</span></h3>
        ${(board[s] || []).map(item => `
          <div class="app-card">
            <div style="font-weight:700; font-size:1rem; margin-bottom:6px;">${item.title}</div>
            <div style="font-size:0.85rem; color:var(--muted); margin-bottom:12px;">${item.company}</div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <button onclick="delApp('${item._id}')" style="background:none; border:none; color:var(--danger); font-size:0.8rem; cursor:pointer;">移除记录</button>
            </div>
          </div>
        `).join('')}
      </div>
    `).join('');
  } catch(e) {}
}
async function delApp(id) { if(confirm('确认移除？')) { await fetch(`${API}/applications/${id}`, {method:'DELETE'}); fetchBoard(); } }

/* ── 活人面经论坛逻辑 (真实图片接入) ── */
async function fetchPosts() {
  const list = document.getElementById('posts-list');
  // 接入 Unsplash 真图和 Pravatar 真实头像
  globalMockPosts = [
    { id: 1, title: "深度求索 DeepSeek 大模型算法一面面经", desc: "面试官气场很强，上来直接手撕了一个 Multi-Head Attention 的实现，顺带聊了聊强化学习...", img: "https://images.unsplash.com/photo-1620712943543-bcc4688e7485?w=500&q=80", author: "算法打工人", avatar: "https://i.pravatar.cc/100?img=11", likes: 1204 },
    { id: 2, title: "终于拿下 Citadel 啦！华尔街量化面经分享", desc: "五轮背靠背面试真的让人窒息。主要是概率论、C++底层机制还有脑筋急转弯，分享几道经典的绿皮书题目。", img: "https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=500&q=80", author: "Quant老哥", avatar: "https://i.pravatar.cc/100?img=33", likes: 893 },
    { id: 3, title: "字节日常实习打卡记录，食堂是真的好", desc: "入职第一天领了MacBook Pro，组内氛围特别好。附带一下当时面试常问的计算机网络知识点汇总。", img: "https://images.unsplash.com/photo-1542204165-65bf26472b9b?w=500&q=80", author: "字节跳动编外", avatar: "https://i.pravatar.cc/100?img=5", likes: 532 },
    { id: 4, title: "四大咨询实习 (PTA) 是不是纯打杂？", desc: "每天就是找数据、画PPT和冷呼。如果你是大一大二，强烈建议来刷个简历，大三的话要考虑ROI了。", img: "https://images.unsplash.com/photo-1497215728101-856f4ea42174?w=500&q=80", author: "Consulting萌新", avatar: "https://i.pravatar.cc/100?img=44", likes: 341 },
    { id: 5, title: "蔚来汽车 (NIO) 智驾岗二面挂了，复盘一下", desc: "主要问了激光雷达点云处理和 C++ 面向对象的高级特性，自己没准备好，明年秋招再战！", img: "https://images.unsplash.com/photo-1560958089-b8a1929cea89?w=500&q=80", author: "自动驾驶迷", avatar: "https://i.pravatar.cc/100?img=12", likes: 215 },
    { id: 6, title: "美妆外企 (欧莱雅) MKT 暑期管培面经", desc: "群面的 Case 是关于新产品的 Go-to-market 策略。切记不要做 Aggressive 的出头鸟，要学会 Leader 团队。", img: "https://images.unsplash.com/photo-1596462502278-27bf85033e5a?w=500&q=80", author: "L'Oreal Girl", avatar: "https://i.pravatar.cc/100?img=20", likes: 677 }
  ];
  
  list.innerHTML = globalMockPosts.map(p => `
    <div class="post-card" onclick="openPost(${p.id})">
      <img src="${p.img}" class="post-cover" />
      <div class="post-body">
        <div class="post-title">${p.title}</div>
        <div class="post-footer">
          <div class="author"><img src="${p.avatar}" class="avatar" /> ${p.author}</div>
          <div>🤍 ${p.likes}</div>
        </div>
      </div>
    </div>
  `).join('');
}

// 打开帖子详情弹窗
function openPost(id) {
  const post = globalMockPosts.find(p => p.id === id);
  if(!post) return;
  document.getElementById('detail-cover').src = post.img;
  document.getElementById('detail-avatar').src = post.avatar;
  document.getElementById('detail-title').textContent = post.title;
  document.getElementById('detail-author').textContent = post.author;
  document.getElementById('detail-desc').textContent = post.desc + "\n\n(此为系统演示内容。完整的前端页面与后端接口对接后即可展示万字长文面经。)";
  openModal('postDetailModal');
}

// 初始化
searchJobs();
</script>
