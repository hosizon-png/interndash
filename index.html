<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PlayJob — 全行业实习引擎</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050505;
      --surface: rgba(28, 28, 30, 0.6);
      --surface-solid: #1c1c1e;
      --border: rgba(255, 255, 255, 0.15);
      --accent: #2997ff;
      --text: #f5f5f7;
      --muted: #86868b;
      --danger: #ff453a;
      --radius: 22px;
      --apple-bezier: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

    /* ── Header ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 5%; position: sticky; top: 0; z-index: 1000;
      background: rgba(5, 5, 5, 0.85); backdrop-filter: saturate(180%) blur(25px);
      border-bottom: 1px solid var(--border);
    }
    .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.8rem; cursor: pointer; }
    .logo span { color: var(--accent); }
    
    .desktop-nav { display: flex; gap: 32px; align-items: center; }
    .desktop-nav a { color: var(--muted); text-decoration: none; font-size: 1.1rem; font-weight: 600; transition: 0.3s; }
    .desktop-nav a.active { color: var(--text); }
    
    .login-btn { padding: 12px 28px; background: var(--text); color: #000; border-radius: 99px; font-weight: 700; font-size: 1rem; cursor: pointer; border: none; }

    /* ── Mobile Tab Bar ── */
    .mobile-tab-bar {
      display: none; position: fixed; bottom: 0; left: 0; width: 100%;
      height: 75px; background: rgba(18, 18, 18, 0.92); backdrop-filter: blur(25px);
      border-top: 1px solid var(--border); z-index: 1000;
      justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom);
    }
    .tab-item { display: flex; flex-direction: column; align-items: center; color: var(--muted); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    .tab-item.active { color: var(--accent); }
    .tab-icon { font-size: 1.7rem; margin-bottom: 4px; }

    main { width: 100%; max-width: 1400px; margin: 0 auto; padding: 40px 5% 120px; }
    .section { display: none; width: 100%; }
    .section.active { display: block; animation: fadeIn 0.4s var(--apple-bezier); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    /* ── Search Bar (修复：更大、更清晰) ── */
    .search-wrapper { 
      display: flex; gap: 15px; margin-bottom: 40px; width: 100%;
      background: var(--surface-solid); padding: 14px 18px; border-radius: 22px; border: 1px solid var(--border);
    }
    .search-wrapper input { flex: 1; background: transparent; border: none; color: #fff; font-size: 1.3rem; font-weight: 500; outline: none; }
    .btn-search { padding: 16px 32px; background: var(--text); color: #000; border-radius: 16px; border: none; font-weight: 800; font-size: 1.1rem; cursor: pointer; white-space: nowrap; }

    /* ── Job Cards ── */
    #jobs-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }
    .job-card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 32px; transition: 0.3s; display: flex; flex-direction: column; }
    .job-card:hover { border-color: var(--accent); transform: translateY(-8px); }
    .job-card .company { color: var(--accent); font-weight: 800; font-size: 1rem; margin-bottom: 12px; text-transform: uppercase; }
    .job-card .title { font-size: 1.5rem; font-weight: 700; margin-bottom: 20px; line-height: 1.3; }

    /* ── Kanban Board (修复显示不全) ── */
    .board-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; width: 100%; }
    .board-column { background: var(--surface-solid); border-radius: 24px; padding: 24px; min-height: 600px; }
    .board-column h3 { font-size: 1.2rem; font-weight: 800; margin-bottom: 25px; display: flex; justify-content: space-between; }
    .app-card { background: rgba(255,255,255,0.06); border-radius: 20px; padding: 20px; margin-bottom: 18px; border: 1px solid var(--border); position: relative; }
    .app-card .title { font-weight: 700; font-size: 1.15rem; margin-bottom: 10px; }

    /* ── Waterfall Forum ── */
    .waterfall-container { width: 100%; column-count: 4; column-gap: 24px; }
    .post-card { break-inside: avoid; display: inline-block; width: 100%; background: var(--surface-solid); border-radius: 24px; overflow: hidden; margin-bottom: 24px; transition: 0.3s; border: 1px solid var(--border); cursor: pointer; }
    .post-cover { width: 100%; height: 200px; object-fit: cover; }
    .post-body { padding: 20px; }
    .post-title { font-weight: 700; font-size: 1.15rem; line-height: 1.4; margin-bottom: 10px; }

    /* ── FAB ── */
    .fab { position: fixed; bottom: 100px; right: 30px; width: 65px; height: 65px; background: var(--text); color: #000; border-radius: 50%; font-size: 32px; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 999; box-shadow: 0 15px 40px rgba(0,0,0,0.5); }

    /* 📱 手机端深度适配 */
    @media (max-width: 768px) {
      header { padding: 14px 5%; }
      .desktop-nav, .login-btn { display: none; }
      .mobile-tab-bar { display: flex; }
      .search-wrapper { border-radius: 20px; padding: 10px; }
      .search-wrapper input { font-size: 1.1rem; }
      .btn-search { padding: 14px 22px; font-size: 1rem; border-radius: 14px; }
      #jobs-container { grid-template-columns: 1fr; gap: 20px; }
      .board-container { display: flex; overflow-x: auto; padding-bottom: 20px; }
      .board-column { min-width: 88vw; }
      .waterfall-container { column-count: 2; column-gap: 15px; }
      .post-cover { height: 160px; }
      .fab { bottom: 95px; right: 20px; width: 60px; height: 60px; }
    }

    #toast { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 14px 35px; border-radius: 50px; font-weight: 800; font-size: 1.1rem; z-index: 5000; display: none; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
  </style>
</head>
<body>

<header>
  <div class="logo" onclick="location.reload()">Play<span>Job</span></div>
  <nav class="desktop-nav">
    <a href="#" class="active" id="dnav-jobs" onclick="showSection('jobs', this)">职位广场</a>
    <a href="#" id="dnav-board" onclick="showSection('board', this)">投递看板</a>
    <a href="#" id="dnav-forum" onclick="showSection('forum', this)">面经社区</a>
  </nav>
  <button class="login-btn" onclick="openModal('loginModal')">登录 / 注册</button>
</header>

<div class="mobile-tab-bar">
  <a href="#" class="tab-item active" id="tab-jobs" onclick="showSection('jobs', this)">
    <span class="tab-icon">✨</span>发现
  </a>
  <a href="#" class="tab-item" id="tab-board" onclick="showSection('board', this)">
    <span class="tab-icon">📋</span>看板
  </a>
  <a href="#" class="tab-item" id="tab-forum" onclick="showSection('forum', this)">
    <span class="tab-icon">💬</span>社区
  </a>
  <a href="#" class="tab-item" onclick="openModal('loginModal')">
    <span class="tab-icon">👤</span>我的
  </a>
</div>

<main>
  <section id="section-jobs" class="section active">
    <div class="search-wrapper">
      <input id="q-input" type="text" placeholder="搜索全球 1000+ 顶尖名企职位..." />
      <button class="btn-search" onclick="searchJobs()">搜索</button>
    </div>
    <div class="job-grid" id="job-grid"></div>
  </section>

  <section id="section-board" class="section">
    <div class="board-container" id="board-container"></div>
  </section>

  <section id="section-forum" class="section">
    <div class="waterfall-container" id="posts-list"></div>
  </section>
</main>

<div class="fab" onclick="showToast('💡 接口准备中...')">+</div>
<div id="toast"></div>

<div class="modal-overlay" id="loginModal" onclick="if(event.target==this) closeModal('loginModal')">
  <div class="modal-box" style="background:#1c1c1e; border:1px solid var(--border); border-radius:32px; width:90%; max-width:480px; padding:40px; color:#fff; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%);">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
      <h2 style="font-size:1.8rem; font-weight:800;">欢迎回来</h2>
      <button onclick="closeModal('loginModal')" style="background:none; border:none; color:var(--muted); font-size:2rem; cursor:pointer;">&times;</button>
    </div>
    <input type="text" placeholder="邮箱/手机号" style="width:100%; padding:16px; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:16px; color:#fff; margin-bottom:20px; outline:none;" />
    <input type="password" placeholder="密码" style="width:100%; padding:16px; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:16px; color:#fff; margin-bottom:30px; outline:none;" />
    <button onclick="showToast('✅ 登录成功')" style="width:100%; padding:18px; background:var(--text); color:#000; border-radius:18px; font-weight:800; border:none; cursor:pointer;">立即登录</button>
  </div>
</div>

<script>
const API = 'https://intern-api-16ja.onrender.com/api';

function showToast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

function openModal(id) { document.getElementById(id).style.display = 'block'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function showSection(name, el) {
  document.querySelectorAll('.desktop-nav a, .tab-item, .section').forEach(i => i.classList.remove('active'));
  if (window.innerWidth > 768) document.getElementById(`dnav-${name}`).classList.add('active');
  else document.getElementById(`tab-${name}`).classList.add('active');
  document.getElementById(`section-${name}`).classList.add('active');
  if(name === 'board') fetchBoard();
  if(name === 'forum') fetchPosts();
}

async function searchJobs() {
  const q = document.getElementById('q-input').value;
  const grid = document.getElementById('job-grid');
  grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px; color:var(--muted); font-size:1.4rem;">🚀 正在全球范围检索优质岗位...</div>';
  try {
    const res = await fetch(`${API}/live-search?q=${encodeURIComponent(q)}`);
    const { data } = await res.json();
    grid.innerHTML = data.map(j => `
      <div class="job-card">
        <div class="company">${j.company}</div>
        <div class="title">${j.title}</div>
        <div style="font-size:1rem; color:var(--muted); margin-bottom:24px;">📍 ${j.location || '全国'}</div>
        <div style="display:flex; gap:12px; margin-top:auto;">
          <button class="btn-search" style="flex:1; background:var(--accent); color:#fff; padding:14px; font-size:1rem;" onclick="window.open('${j.sourceUrl}')">直达申请</button>
          <button class="btn-search" style="flex:1; background:rgba(255,255,255,0.1); color:#fff; padding:14px; font-size:1rem; border:1px solid var(--border);" onclick="addBoard('${j.company}','${j.title}')">加入看板</button>
        </div>
      </div>
    `).join('');
  } catch(e) { grid.innerHTML = '加载失败'; }
}

async function addBoard(company, title) {
  await fetch(`${API}/applications`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({company, title}) });
  showToast('✅ 成功加入看板');
}

async function fetchBoard() {
  const container = document.getElementById('board-container');
  const STATUS = { applied:'投递', interview:'面试', offer:'录取', reject:'淘汰' };
  try {
    const res = await fetch(`${API}/applications`);
    const { board } = await res.json();
    container.innerHTML = Object.keys(STATUS).map(s => `
      <div class="board-column">
        <h3>${STATUS[s]} <span>${board[s]?.length || 0}</span></h3>
        ${(board[s] || []).map(item => `
          <div class="app-card">
            <button onclick="delApp('${item._id}')" style="position:absolute; top:12px; right:12px; background:none; border:none; color:var(--danger); font-size:1.4rem; cursor:pointer;">&times;</button>
            <div class="title">${item.title}</div>
            <div style="font-size:1rem; color:var(--muted);">${item.company}</div>
          </div>
        `).join('')}
      </div>
    `).join('');
  } catch(e) {}
}
async function delApp(id) { if(confirm('确认移除？')) { await fetch(`${API}/applications/${id}`, {method:'DELETE'}); fetchBoard(); } }

async function fetchPosts() {
  const list = document.getElementById('posts-list');
  const mock = [
    { t: "拿了 NVIDIA 智驾岗 Offer，分享一些心经", img: "https://images.unsplash.com/photo-1620712943543-bcc4688e7485?w=500", a: "AI大牛", l: 2431 },
    { t: "字节跳动后端三面总结 (附真题)", img: "https://images.unsplash.com/photo-1542204165-65bf26472b9b?w=500", a: "干饭人", l: 1532 },
    { t: "中金投行暑期实习体验：比想象中更卷", img: "https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=500", a: "FinBoy", l: 890 },
    { t: "大模型算法岗面试究竟考什么？", img: "https://images.unsplash.com/photo-1497215728101-856f4ea42174?w=500", a: "NLP专家", l: 1243 }
  ];
  list.innerHTML = mock.map(p => `
    <div class="post-card">
      <img src="${p.img}" class="post-cover" />
      <div class="post-body">
        <div class="post-title">${p.t}</div>
        <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.9rem; color:var(--muted);">
          <span>👤 ${p.a}</span><span>❤️ ${p.l}</span>
        </div>
      </div>
    </div>
  `).join('');
}

searchJobs();
</script>
</body>
</html>
