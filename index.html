<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayJob — 探索你的无限可能</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Apple 风格极简变量 ── */
    :root {
      --bg: #000000;
      --surface: rgba(28, 28, 30, 0.6);
      --surface-solid: #1c1c1e;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #2997ff;
      --accent-hover: #0071e3;
      --text: #f5f5f7;
      --muted: #86868b;
      --danger: #ff3b30;
      --warn: #ff9f0a;
      --success: #32d74b;
      --radius: 18px;
      --apple-bezier: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 48px; position: sticky; top: 0;
      background: rgba(0, 0, 0, 0.7); backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border); z-index: 100;
    }
    .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.5rem; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); }
    nav a { color: var(--muted); text-decoration: none; margin-left: 32px; font-size: 0.9rem; font-weight: 500; transition: 0.3s; }
    nav a:hover, nav a.active { color: var(--text); }

    /* ── 布局与通用 ── */
    main { max-width: 1200px; margin: 0 auto; padding: 60px 24px 100px; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
    .section-header h2 { font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; }
    .section { display: none; animation: fadeIn 0.5s var(--apple-bezier); }
    .section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ── 按钮与表单 ── */
    .btn { padding: 10px 20px; border: none; border-radius: 999px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: all 0.3s var(--apple-bezier); }
    .btn:active { transform: scale(0.95); }
    .btn-primary { background: var(--text); color: var(--bg); }
    .btn-primary:hover { background: #fff; transform: scale(1.02); }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--surface-solid); color: var(--text); border: 1px solid var(--border); }
    .btn-xs { padding: 8px 16px; font-size: 0.85rem; border-radius: 8px; }

    input, textarea {
      padding: 12px 16px; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); font-size: 0.95rem; outline: none; transition: 0.3s;
    }
    input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(41, 151, 255, 0.15); }
    
    .search-bar { display: flex; gap: 12px; margin-bottom: 40px; }
    .search-bar input { flex: 1; backdrop-filter: blur(10px); }

    /* ── 岗位卡片 ── */
    #jobs-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
    .job-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 24px; transition: all 0.4s var(--apple-bezier); backdrop-filter: blur(20px);
    }
    .job-card:hover { border-color: rgba(255,255,255,0.2); transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.4); background: rgba(40, 40, 44, 0.8); }
    .job-card .company { font-size: 0.85rem; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
    .job-card .job-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 12px; }
    .job-card .meta { display: flex; gap: 16px; font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; }
    .tag { padding: 4px 12px; border-radius: 6px; font-size: 0.75rem; background: rgba(255,255,255,0.08); }

    /* ── 看板样式 ── */
    .board-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .board-column { background: var(--surface-solid); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; min-height: 300px; }
    .board-column h3 { font-size: 1rem; margin-bottom: 16px; display: flex; justify-content: space-between; }
    .app-card { background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .app-card .title { font-weight: 600; margin-bottom: 6px; font-size: 0.95rem; }
    .app-card .meta { color: var(--muted); font-size: 0.8rem; margin-bottom: 12px; }
    .pill { padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; }
    .pill-applied { background: rgba(41,151,255,0.2); color: var(--accent); }
    .pill-interview { background: rgba(255,159,10,0.2); color: var(--warn); }
    .pill-offer { background: rgba(50,215,75,0.2); color: var(--success); }
    .pill-reject { background: rgba(255,59,48,0.2); color: var(--danger); }

    /* ── 论坛样式 ── */
    .forum-layout { display: grid; gap: 24px; grid-template-columns: 1fr 2fr; }
    .panel { background: var(--surface-solid); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
    .post-item { background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .post-item .title { font-weight: 600; font-size: 1.1rem; margin-bottom: 8px; }
    .post-item .meta { color: var(--muted); font-size: 0.85rem; }

    /* ── 弹窗 ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.4s; z-index: 999; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content { background: var(--surface-solid); border: 1px solid var(--border); border-radius: 24px; width: 90%; max-width: 450px; padding: 32px; transform: scale(0.9); transition: 0.4s; }
    .modal-overlay.active .modal-content { transform: scale(1); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }
    .form-group input { width: 100%; }

    #toast { position: fixed; top: 80px; left: 50%; transform: translate(-50%, -20px); background: var(--text); color: var(--bg); padding: 12px 24px; border-radius: 999px; font-size: 0.95rem; font-weight: 600; opacity: 0; pointer-events: none; transition: 0.4s; z-index: 1000; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>

<header>
  <div class="logo">Play<span>Job</span></div>
  <nav>
    <a href="#" class="active" onclick="showSection('jobs', this)">发现岗位</a>
    <a href="#" onclick="showSection('board', this)">我的看板</a>
    <a href="#" onclick="showSection('forum', this)">面经论坛</a>
  </nav>
</header>

<main>
  <!-- 岗位页 -->
  <section id="section-jobs" class="section active">
    <div class="section-header">
      <h2>探索实习机会</h2>
      <button class="btn btn-accent" onclick="openModal()">＋ 录入新岗位</button>
    </div>
    <div class="search-bar">
      <input id="search-company" type="text" placeholder="搜索公司 (如: 腾讯, 蔚来)..." />
      <input id="search-title" type="text" placeholder="搜索职位 (如: 前端)..." />
      <button class="btn btn-primary" onclick="fetchJobs()">搜索</button>
      <button class="btn btn-secondary" onclick="clearSearch()">重置</button>
    </div>
    <div id="jobs-container"></div>
  </section>

  <!-- 看板页 -->
  <section id="section-board" class="section">
    <div class="section-header">
      <h2>投递进度看板</h2>
      <button class="btn btn-secondary" onclick="fetchBoard()">刷新看板</button>
    </div>
    <div class="board-grid" id="board-container"></div>
  </section>

  <!-- 论坛页 -->
  <section id="section-forum" class="section">
    <div class="section-header">
      <h2>面经交流社区</h2>
      <button class="btn btn-secondary" onclick="fetchPosts()">刷新帖子</button>
    </div>
    <div class="forum-layout">
      <div class="panel">
        <h3 style="margin-bottom:16px;">发布新帖</h3>
        <input id="post-title" placeholder="标题（如：字节一面面经）" style="width:100%; margin-bottom:12px;" />
        <textarea id="post-content" placeholder="分享你的面试经验..." style="width:100%; height:120px; margin-bottom:12px; resize:vertical;"></textarea>
        <button class="btn btn-primary" style="width:100%;" onclick="createPost()">发布</button>
      </div>
      <div class="panel">
        <h3 style="margin-bottom:16px;">最新讨论</h3>
        <div id="posts-container"></div>
      </div>
    </div>
  </section>
</main>

<!-- 手动录入弹窗 -->
<div class="modal-overlay" id="addJobModal">
  <div class="modal-content">
    <div style="display:flex; justify-content:space-between; margin-bottom:24px;">
      <h3 style="font-size:1.4rem;">分享岗位信息</h3>
      <button onclick="closeModal()" style="background:none; border:none; color:var(--muted); font-size:1.5rem; cursor:pointer;">×</button>
    </div>
    <div class="form-group"><label>公司名称 *</label><input id="manual-company" type="text" /></div>
    <div class="form-group"><label>职位名称 *</label><input id="manual-title" type="text" /></div>
    <div class="form-group"><label>工作地点</label><input id="manual-location" type="text" /></div>
    <div class="form-group"><label>投递链接 (选填)</label><input id="manual-url" type="text" /></div>
    <button class="btn btn-accent" style="width:100%; margin-top:10px;" onclick="submitManualJob()">发布至广场</button>
  </div>
</div>

<div id="toast"></div>

<script>
const API_BASE = 'https://intern-api-16ja.onrender.com/api';

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

async function apiFetch(path, options = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    headers: { 'Content-Type': 'application/json', ...options.headers },
    ...options,
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

/* ── 导航切换 ── */
function showSection(name, el) {
  document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
  if(el) el.classList.add('active');
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(`section-${name}`).classList.add('active');

  if (name === 'jobs') fetchJobs();
  if (name === 'board') fetchBoard();
  if (name === 'forum') fetchPosts();
}

/* ── 1. 发现岗位 (整合自动抓取与手动录入) ── */
async function fetchJobs() {
  const container = document.getElementById('jobs-container');
  const company = document.getElementById('search-company').value.trim();
  const title = document.getElementById('search-title').value.trim();
  
  const query = `${company} ${title}`.trim();

  // 情况 A：如果用户输入了关键词，开启“全网现场搜索”模式
  if (query) {
    container.innerHTML = `
      <div style="grid-column: 1/-1; text-align: center; padding: 40px;">
        <div style="color: var(--accent); font-size: 1.2rem; margin-bottom: 10px;">🚀 正在全网现场搜寻最新职位...</div>
        <div style="color: var(--muted); font-size: 0.9rem;">正在嵌套搜索引擎结果，请稍候</div>
      </div>
    `;

    try {
      // 请求我们刚才在后端写的 live-search 接口
      const data = await apiFetch(`/live-search?q=${encodeURIComponent(query)}`);
      const jobs = data.data || [];
      
      if (!jobs.length) {
        container.innerHTML = '<div style="color:var(--muted); grid-column:1/-1;">未找到相关实时结果，请换个关键词试试。</div>';
        return;
      }

      renderJobCards(jobs, true); // true 表示这是实时搜索结果
    } catch (err) {
      console.error(err);
      container.innerHTML = '<div style="color:var(--danger); grid-column:1/-1;">实时搜索服务暂时不可用，请稍后再试。</div>';
    }
  } 
  // 情况 B：如果输入框为空，则显示数据库里的缓存数据
  else {
    container.innerHTML = '<div style="color:var(--muted);">正在加载云端精选岗位...</div>';
    try {
      const data = await apiFetch(`/jobs?page=1&limit=50`);
      renderJobCards(data.data || [], false);
    } catch (err) {
      container.innerHTML = '<div style="color:var(--danger);">无法连接到云端数据库。</div>';
    }
  }
}

// ─── 渲染卡片的通用函数 ───
function renderJobCards(jobs, isLive) {
  const container = document.getElementById('jobs-container');
  container.innerHTML = jobs.map(job => `
    <div class="job-card" onclick="window.open('${job.sourceUrl}', '_blank')">
      <div class="company">${escapeHtml(job.company)}</div>
      <div class="job-title">${escapeHtml(job.title)}</div>
      <div class="meta">
        <span>📍 ${escapeHtml(job.location)}</span>
        <span>${isLive ? '🌐 实时检索' : '✨ 云端精选'}</span>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;">
        ${(job.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-accent btn-xs">直达投递官网</button>
        <button class="btn btn-secondary btn-xs" onclick="event.stopPropagation(); applyJob('${job._id || 'manual'}')">加入看板</button>
      </div>
    </div>
  `).join('');
}

// 弹窗逻辑
function openModal() { document.getElementById('addJobModal').classList.add('active'); }
function closeModal() { document.getElementById('addJobModal').classList.remove('active'); }

async function submitManualJob() {
  const company = document.getElementById('manual-company').value.trim();
  const title = document.getElementById('manual-title').value.trim();
  if (!company || !title) return showToast('⚠️ 公司和职位必填');

  try {
    await apiFetch('/jobs', {
      method: 'POST',
      body: JSON.stringify({
        company, title, 
        location: document.getElementById('manual-location').value.trim() || '未知',
        sourceUrl: document.getElementById('manual-url').value.trim(),
        tags: ['社区分享']
      })
    });
    showToast('✅ 发布成功！');
    closeModal();
    fetchJobs(); // 刷新列表
  } catch (err) {
    showToast('❌ 发布失败，可能是后端暂不支持此接口');
  }
}

/* ── 2. 我的看板 (加入看板、转状态) ── */
async function applyJob(jobId) {
  try {
    await apiFetch('/applications', { method: 'POST', body: JSON.stringify({ job: jobId, applicantName: '我' }) });
    showToast('✅ 已加入看板！');
  } catch (err) {
    showToast(`❌ 加入失败：${err.message}`);
  }
}

const APP_STATUS = ['applied', 'interview', 'offer', 'reject'];
const STATUS_NAME = { applied: '已投递', interview: '面试中', offer: '已 Offer', reject: '已淘汰' };

async function fetchBoard() {
  const container = document.getElementById('board-container');
  try {
    const data = await apiFetch('/applications');
    const board = data.board || {};
    
    container.innerHTML = APP_STATUS.map(status => {
      const list = board[status] || [];
      const cards = list.map(item => {
        const job = item.job || {};
        return `
          <div class="app-card">
            <div class="title">${escapeHtml(job.title || '未知岗位')}</div>
            <div class="meta">${escapeHtml(job.company || '未知公司')} · ${escapeHtml(job.location)}</div>
            <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;">
              ${APP_STATUS.filter(s => s !== status).map(s => 
                `<button class="btn-secondary btn-xs" style="padding:4px 8px; font-size:0.75rem;" onclick="updateApp('${item._id}', '${s}')">转为${STATUS_NAME[s]}</button>`
              ).join('')}
              <button class="btn-secondary btn-xs" style="padding:4px 8px; font-size:0.75rem; color:var(--danger);" onclick="deleteApp('${item._id}')">删除</button>
            </div>
          </div>`;
      }).join('');

      return `
        <div class="board-column">
          <h3>${STATUS_NAME[status]} <span class="pill pill-${status}">${list.length}</span></h3>
          ${cards || '<div style="color:var(--muted); font-size:0.85rem;">暂无记录</div>'}
        </div>`;
    }).join('');
  } catch (err) {
    container.innerHTML = '<div style="color:var(--danger);">看板加载失败</div>';
  }
}

async function updateApp(id, status) {
  try { await apiFetch(`/applications/${id}`, { method: 'PUT', body: JSON.stringify({ status }) }); fetchBoard(); } catch(err) { showToast('❌ 操作失败'); }
}
async function deleteApp(id) {
  try { await apiFetch(`/applications/${id}`, { method: 'DELETE' }); fetchBoard(); showToast('🗑️ 已删除'); } catch(err) { showToast('❌ 删除失败'); }
}

/* ── 3. 面经论坛 ── */
async function fetchPosts() {
  const container = document.getElementById('posts-container');
  try {
    const data = await apiFetch(`/posts?page=1&limit=20`);
    const posts = data.data || [];
    if (!posts.length) { container.innerHTML = '<div style="color:var(--muted);">暂无面经，来发布第一条吧！</div>'; return; }

    container.innerHTML = posts.map(post => `
      <div class="post-item">
        <div class="title">${escapeHtml(post.title)}</div>
        <div class="meta" style="margin-bottom:8px;">匿名用户 · 👀 ${post.views || 0}阅读 · 👍 ${post.likes || 0}点赞</div>
        <div style="color:var(--text); font-size:0.9rem; line-height:1.5; margin-bottom:12px;">${escapeHtml(post.content).substring(0, 80)}...</div>
        <button class="btn-secondary btn-xs" onclick="likePost('${post._id}')">👍 赞一个</button>
      </div>
    `).join('');
  } catch (err) { container.innerHTML = '<div style="color:var(--danger);">帖子加载失败</div>'; }
}

async function createPost() {
  const title = document.getElementById('post-title').value.trim();
  const content = document.getElementById('post-content').value.trim();
  if (!title || !content) return showToast('⚠️ 标题和内容必填');
  try {
    await apiFetch('/posts', { method: 'POST', body: JSON.stringify({ author:'匿名', title, content, tags:['面经'] }) });
    showToast('✅ 发帖成功！');
    document.getElementById('post-title').value = '';
    document.getElementById('post-content').value = '';
    fetchPosts();
  } catch (err) { showToast('❌ 发帖失败'); }
}

async function likePost(id) {
  try { await apiFetch(`/posts/${id}/like`, { method: 'PUT' }); fetchPosts(); } catch(err) {}
}

// 初始化
fetchJobs();
</script>
</body>
</html>
